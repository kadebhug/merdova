</svg><div class="fig-cap">A feedback policy doesn't just set a rule \u2014 it monitors the system and rewrites the rule as reality reveals itself.</div></div>

<div data-classify="ex9"></div>

<div class="note"><b>Why this matters:</b> under uncertainty, the smartest policy isn't the boldest fixed target \u2014 it's the one that watches the system and adjusts, learning as it goes.</div>
`,
quiz:[
{q:"Why can't a static policy govern a dynamic feedback system well?",o:["Static policies are illegal","A self-adjusting system needs policies that change with the state of the system","Dynamic systems never change","Static policies are always too weak"],a:1,e:"P. 201: it's more effective and cheaper to design policies that adjust to the system's state than to impose an unbending rule."},
{q:"Carter's proposed gasoline tax was a feedback policy because\u2026",o:["It was very high","It rose and fell automatically with the fraction of oil that had to be imported","It banned oil imports","It was permanent and fixed"],a:1,e:"Pp. 200\u2013201: the tax self-adjusted \u2014 rising to suppress demand as imports rose, falling to zero if imports did."},
{q:"A meta-feedback (learning) policy is one that\u2026",o:["Never changes once set","Contains loops that alter, correct, and expand the policy's own loops as knowledge grows","Ignores monitoring","Sets the strictest possible target up front"],a:1,e:"P. 201: under high uncertainty the best policies build in loops that revise themselves \u2014 designing learning into management."},
{q:"The Montreal Protocol exemplifies a feedback policy because it\u2026",o:["Set one fixed schedule and never revisited it","Set targets but required monitoring and reconvening to revise the schedule as damage was better understood","Banned all chemicals immediately","Relied only on voluntary action"],a:1,e:"P. 201: it paired phase-out targets with monitoring and a mechanism to accelerate the schedule \u2014 which happened by 1990."}
]},

{id:"m7l6",title:"Good of the Whole \u00b7 Wisdom of the System \u00b7 Locate Responsibility",pages:"pp. 201\u2013204",
obj:["Explain why hierarchies exist to serve their lower layers","Explain why intervenors should respect a system's self-maintaining capacities","Define intrinsic responsibility and give examples of designing for it"],
html:`
<p>Three closely linked lessons about where to direct effort. First, <span class="kw">go for the good of the whole</span>: hierarchies exist to serve the bottom layers, not the top. Don't maximize one subsystem while ignoring the whole, and don't (as Boulding said) work hard to optimize something that shouldn't be done at all. Aim to enhance whole-system properties \u2014 stability, diversity, resilience, sustainability \u2014 whether or not they're easily measured.</p>

<h3>Listen to the wisdom of the system</h3>
<p>Second, aid the forces and structures that help a system run itself \u2014 many of which sit at the <b>bottom</b> of the hierarchy \u2014 and don't be an unthinking intervenor who destroys a system's self-maintenance capacity. Meadows's friend Nathan Gray, an aid worker in Guatemala, watched agencies march past a thriving local market \u2014 basket makers, growers, butchers already creating their own jobs \u2014 to "attract outside investors." He instead asked the market people what blocked <em>them</em>, and concluded the community needed inside investors: small loans at fair rates and classes in literacy and accounting, not an imported factory.</p>

<h3>Locate responsibility in the system</h3>
<p>Third, <span class="kw">intrinsic responsibility</span> means designing a system so feedback about the consequences of a decision returns <b>directly, quickly, and compellingly to the decision maker</b>. A pilot rides in the front of the plane, so experiences the results of every choice. Dartmouth <em>reduced</em> responsibility by moving thermostats to a central computer \u2014 an overheated professor now had to phone across campus and wait hours for an over-correction. Designing <em>for</em> responsibility might mean requiring a factory's water intake to sit downstream of its own outflow, or refusing to let Congress exempt itself from its own rules, or \u2014 Hardin's example \u2014 noting that those who would forbid an abortion aren't practicing intrinsic responsibility unless willing to raise the resulting child.</p>

<div class="note"><b>Why this matters:</b> the highest-value interventions usually serve the whole, build on what the system already does well, and route consequences back to whoever decides \u2014 rather than imposing control from the top.</div>
`,
quiz:[
{q:"'Go for the good of the whole' includes the principle that\u2026",o:["The top of a hierarchy is what matters most","Hierarchies exist to serve their lower layers, not the top","Subsystems should always be maximized individually","Only measurable properties count"],a:1,e:"P. 201: don't maximize parts while ignoring the whole; enhance total-system properties like resilience and sustainability."},
{q:"The Guatemala market story illustrates 'listen to the wisdom of the system' by showing that\u2026",o:["Outside investors are always best","Respecting and building on the system's existing self-maintaining capacities beats overriding them","Local markets should be replaced","Aid never works"],a:1,e:"P. 202: the thriving local entrepreneurs needed inside investment (small loans, literacy) rather than an imposed outside factory."},
{q:"'Intrinsic responsibility' means a system is designed so that\u2026",o:["Blame can always be assigned to outsiders","Feedback about a decision's consequences returns directly and compellingly to the decision maker","Responsibility is centralized at the top","No one is ever held accountable"],a:1,e:"Pp. 202\u2013203: like a pilot in the front of the plane, the decision maker directly experiences the consequences of the decision."},
{q:"Moving Dartmouth's thermostats to a central computer is cited as an example of\u2026",o:["Increasing intrinsic responsibility","Reducing intrinsic responsibility, worsening temperature oscillations","A successful feedback policy","Going for the good of the whole"],a:1,e:"Pp. 202\u2013203: centralizing control severed the direct feedback loop, so occupants could no longer correct their own conditions."}
]},

{id:"m7l7",title:"Stay Humble, Stay a Learner \u00b7 Celebrate Complexity",pages:"pp. 204\u2013206",
obj:["Explain why 'error-embracing' is a condition for learning in complex systems","Contrast 'stay the course' with small steps and constant monitoring","Explain why complexity is to be celebrated rather than suppressed"],
html:`
<p>Working with systems constantly reminds you how incomplete your mental models are and how much you don't know. The right response to not knowing, Meadows says, is <b>not to bluff and not to freeze, but to learn</b> \u2014 and you learn by experiment, or as Buckminster Fuller put it, "by trial and error, error, error."</p>

<h3>Error-embracing</h3>
<p>In a world of complex systems, charging forward with rigid directives is inappropriate. "Stay the course" is only wise if you're sure you're on course; pretending you're in control when you aren't is a recipe not just for mistakes but for <em>not learning</em> from them. What's appropriate is small steps, constant monitoring, and willingness to change direction as you learn where it leads. That means making mistakes and \u2014 harder \u2014 admitting them, what Don Michael called <span class="kw">error-embracing</span>. Acknowledging uncertainty takes courage, but it's the condition for learning, and it can actually <em>increase</em> credibility: acting as if you have all the facts, on complex social issues, decreases it.</p>

<h3>Celebrate complexity</h3>
<p>Face it: the universe is messy \u2014 nonlinear, turbulent, dynamic, spending its time in transient behavior on the way somewhere else, not in neat equilibria. Part of the human mind is drawn to straight lines, whole numbers, uniformity, and certainty. But another part, shaped by our own evolution as complex feedback systems, instinctively recognizes that <b>nature designs in fractals</b> \u2014 detail on every scale \u2014 and it's this part that makes Gothic cathedrals, Persian carpets, symphonies, and novels. Some of us celebrate and encourage self-organization, disorder, variety, and diversity, even making a moral code of it, as Aldo Leopold did: a thing is right when it tends to preserve the integrity, stability, and beauty of the biotic community.</p>

<div class="note"><b>Why this matters:</b> humility and love of complexity are the same disposition seen twice \u2014 both accept that the world exceeds our models, and both turn that acceptance into learning rather than denial.</div>
`,
quiz:[
{q:"In a complex system, Meadows says the right response to not knowing is to\u2026",o:["Bluff confidently","Freeze until you're certain","Learn by experiment \u2014 small steps, constant monitoring, willingness to change course","Charge forward with rigid directives"],a:1,e:"Pp. 204\u2013205: don't bluff or freeze; learn by trial and error with small steps and monitoring."},
{q:"'Error-embracing' is described as\u2026",o:["A sign of incompetence to be hidden","The condition for learning \u2014 seeking, using, and sharing information about what went wrong","Refusing to ever admit mistakes","Only acceptable for scientists"],a:1,e:"Pp. 204\u2013205: admitting and learning from error is required for learning, and acknowledging uncertainty can increase credibility."},
{q:"Meadows argues that 'stay the course' is\u2026",o:["Always the wisest policy","Only a good idea if you're sure you're on course","Never appropriate under any conditions","A form of error-embracing"],a:1,e:"P. 204: pretending to be in control when you aren't prevents learning; rigid persistence is unwise when the course is uncertain."},
{q:"'Celebrate complexity' rests on the observation that\u2026",o:["The universe is fundamentally simple and linear","The universe is messy, nonlinear, and fractal, and part of us recognizes and creates such complexity","Complexity should always be eliminated","Only straight lines and certainty are natural"],a:1,e:"Pp. 205\u2013206: nature designs in fractals; celebrating self-organization and diversity aligns us with how the world actually works."}
]},

{id:"m7l8",title:"Expand Time Horizons \u00b7 Defy the Disciplines \u00b7 Expand Caring",pages:"pp. 206\u2013208",
obj:["Explain why longer time horizons improve a society's survival","Explain why following a system requires crossing disciplinary boundaries","Explain how interconnection makes moral and practical rules coincide"],
html:`
<p>Three lessons about widening our horizons \u2014 in time, in thought, and in care. First, <span class="kw">expand time horizons</span>. Meadows calls the interest rate one of humanity's worst ideas, since payback periods and discount rates give a quantitative excuse for ignoring the long term. Industrial society's official horizon rarely reaches past the next election or investment payback; many families think in generations, and some Native American cultures weighed effects on the <b>seventh generation</b>. The longer the operant horizon, the better the odds of survival \u2014 and in a strict systems sense there's no clean long/short-term divide anyway, since fast and slow processes are nested within each other. On a tricky path you watch both the next step and the far distance \u2014 the whole system.</p>

<h3>Defy the disciplines</h3>
<p>Follow a system wherever it leads, and it will surely cross disciplinary lines. You'll have to learn from \u2014 without being limited by \u2014 economists, chemists, psychologists, and theologians, penetrating their jargons and discarding the distortions that come from each narrow lens. This is more than being "interdisciplinary" in the usual sense of experts talking past each other; real cross-boundary work happens only when there's a genuine problem to solve and everyone is more committed to solving it than to being academically correct \u2014 which means going into <b>learning mode</b> and admitting ignorance.</p>

<h3>Expand the boundary of caring</h3>
<p>Above all, <b>expand the horizons of caring</b>. There are moral reasons, and where those don't suffice, systems thinking supplies practical ones: the real system is interconnected. No part of humanity is separate from the rest or from the global ecosystem. Your heart can't succeed if your lungs fail; a company can't succeed if its workers fail; the rich of Los Angeles can't succeed if its poor fail; Europe can't succeed if Africa fails. As with everything about systems, most people already know these interconnections \u2014 they just have to bring themselves to <em>believe what they know</em>, so that moral and practical rules turn out to be the same rules.</p>

<div class="note"><b>Why this matters:</b> interconnection is the thread linking all three lessons \u2014 across time, across disciplines, and across the people and ecosystems a system touches, the whole is what determines whether any part can thrive.</div>
`,
quiz:[
{q:"Why does Meadows criticize interest rates, payback periods, and discount rates?",o:["They are mathematically incorrect","They give a quantitative excuse for ignoring the long term","They are too hard to calculate","They always cause inflation"],a:1,e:"P. 206: these devices rationalize discounting the future; longer time horizons improve a society's chances of survival."},
{q:"'Defy the disciplines' means that to understand a system you must\u2026",o:["Stay strictly within your own field","Follow it across disciplinary lines, learning from many fields without being limited by them","Trust economists above all others","Avoid experts entirely"],a:1,e:"P. 207: systems cross disciplinary boundaries, so you must integrate and filter what many disciplines can and can't honestly see."},
{q:"According to Meadows, real cross-disciplinary work succeeds only when participants\u2026",o:["Are the most senior experts","Are more committed to solving a real problem than to being academically correct","Never admit ignorance","Stay in their separate lanes"],a:1,e:"P. 207: it works when there's a genuine problem and people go into learning mode, admitting ignorance rather than talking past each other."},
{q:"The practical (not just moral) reason to expand the boundary of caring is that\u2026",o:["Caring feels good","The real system is interconnected, so no part can succeed while the parts it depends on fail","Morality has no practical basis","Systems thinking opposes caring"],a:1,e:"Pp. 207\u2013208: interconnection means moral and practical rules coincide \u2014 the heart can't succeed if the lungs fail."}
]},

{id:"m7l9",title:"Don't Erode the Goal of Goodness",pages:"pp. 208\u2013209",
obj:["Explain how the drift-to-low-performance trap erodes a society's moral goals","Identify the perceptual bias that lowers moral expectations","Apply the antidote: don't over-weight bad news, and keep standards absolute"],
html:`
<p>The book's final lesson returns to a familiar trap. The most damaging instance of <span class="kw">drift to low performance</span>, Meadows argues, is the way modern industrial culture has eroded the goal of <b>morality</b> itself \u2014 and the mechanism is classic and awful to watch.</p>

<h3>How the goal of goodness erodes</h3>
<p>Examples of bad human behavior are magnified by the media and affirmed by the culture as <em>typical</em> \u2014 "after all, we're only human." The far more numerous examples of goodness are barely noticed; they're "not news," dismissed as exceptions ("must have been a saint"). So expectations sink. The gap between desired and actual behavior narrows, fewer actions are taken to affirm ideals, public discourse fills with cynicism, leaders are unrepentantly amoral without being held to account, and idealism is ridiculed \u2014 it becomes easier to talk publicly about hate than about love. This is exactly the eroding-goals loop you met earlier: a downbeat perception drags the standard down, which reduces corrective effort, which lowers actual performance, which drags perception down again.</p>

<h3>The antidote, and its limit</h3>
<p>We already know what to do about drift to low performance: <b>don't weigh the bad news more heavily than the good, and keep standards absolute</b>. But here Meadows reaches the honest edge of her whole book. Systems thinking can <em>tell</em> us to do this \u2014 it cannot <em>do</em> it. We're back at the gap between understanding and implementation. Systems thinking can't bridge that gap; it can only lead us to the edge of what analysis can do and then point beyond \u2014 to what can and must be done by the <b>human spirit</b>.</p>

<div class="note"><b>Why this matters:</b> the book ends where analysis runs out. Keeping the goal of goodness from eroding is a systems prescription, but carrying it out is a human act of will \u2014 the dance, finally, is ours to do.</div>
`,
quiz:[
{q:"The erosion of moral goals in modern culture is an example of which trap?",o:["The tragedy of the commons","Drift to low performance (eroding goals)","Escalation","Success to the successful"],a:1,e:"P. 208: Meadows calls it the most damaging case of drift to low performance \u2014 the goal of morality eroding over time."},
{q:"What perceptual bias drives the erosion of the goal of goodness?",o:["Good behavior is over-reported","Bad behavior is magnified as typical while goodness is dismissed as exceptional, lowering expectations","People remember only good news","Standards are set too high"],a:1,e:"P. 208: magnifying bad news and dismissing goodness as 'not news' narrows the gap between desired and actual behavior, dragging the goal down."},
{q:"The prescribed antidote is to\u2026",o:["Lower standards to match reality","Not weigh bad news more heavily than good, and keep standards absolute","Ignore all news","Wait for leaders to improve"],a:1,e:"Pp. 208\u2013209: the eroding-goals cure is to resist the downbeat bias and hold standards absolute."},
{q:"Meadows ends the book by acknowledging that systems thinking\u2026",o:["Can solve every problem on its own","Can tell us what to do but can't do it \u2014 implementation falls to the human spirit","Is ultimately useless","Bridges the gap between understanding and action completely"],a:1,e:"P. 209: systems thinking leads to the edge of analysis and points beyond, to what must be done by the human spirit."}
]}

]},
{title:"Module 8 \u00b7 Appendix \u2014 Consolidation & Reference",lessons:[

{id:"m8l1",title:"The Core Vocabulary",pages:"pp. 210\u2013211",
obj:["Define the foundational terms: stock, flow, feedback loop, dynamic equilibrium","Distinguish balancing from reinforcing loops and linear from nonlinear relationships","Classify examples using the glossary's precise definitions"],
html:`
<p>The glossary that opens the appendix is worth treating as a checklist: if you can define each term crisply and place an example under it, the whole book has landed. This lesson consolidates the vocabulary you've met across seven chapters into one precise reference.</p>

<h3>The building blocks</h3>
<p>A <span class="kw">system</span> is a set of parts coherently interconnected in a way that produces a characteristic set of behaviors \u2014 its function or purpose. A <span class="kw">stock</span> is an accumulation built up over time (the memory of the system's changing flows); a <span class="kw">flow</span> is material or information entering or leaving a stock over a period of time. When the sum of inflows equals the sum of outflows, the stock holds steady in <span class="kw">dynamic equilibrium</span> \u2014 unchanging even though material still moves through it.</p>

<h3>How stocks change: feedback</h3>
<p>A <span class="kw">feedback loop</span> is a closed chain of causal links running from a stock, through decisions or rules or actions that depend on the stock's level, and back through a flow to change that stock. A <b>balancing</b> (negative) loop is stabilizing and goal-seeking \u2014 it opposes whatever change is imposed. A <b>reinforcing</b> (positive) loop amplifies change \u2014 the vicious cycles and virtuous circles. Which one dominates can change over time; the glossary calls that <span class="kw">shifting dominance</span>.</p>

<h3>The rest of the toolkit</h3>
<p>A <b>linear</b> relationship keeps a constant proportion between cause and effect (a straight line); a <b>nonlinear</b> one does not. <span class="kw">Resilience</span> is the ability to recover from a perturbation; <span class="kw">self-organization</span> is the ability to build new structure, learn, and diversify; a <span class="kw">hierarchy</span> is systems nested within systems. <span class="kw">Bounded rationality</span> is the logic that makes sense within one part of a system but not for the wider whole \u2014 and <span class="kw">suboptimization</span> is what happens when a subsystem's goals win at the expense of the whole.</p>

<div data-classify="ex10"></div>

<div class="note"><b>Why this matters:</b> these terms aren't jargon for its own sake \u2014 each names a distinction that changes how you'd intervene. Confusing a stock with a flow, or a balancing loop with a reinforcing one, sends you pushing the wrong lever.</div>
`,
quiz:[
{q:"A stock is best described as\u2026",o:["The rate at which something moves through a system","An accumulation built up over time \u2014 the memory of the system's changing flows","A closed causal chain","A straight-line relationship"],a:1,e:"P. 210: a stock is an accumulation of material or information built up over time; flows are what enter and leave it."},
{q:"Dynamic equilibrium occurs when\u2026",o:["All flows stop entirely","The sum of inflows equals the sum of outflows, so the stock holds steady though material still moves","A reinforcing loop dominates","The system has no feedback"],a:1,e:"P. 210: the stock's level is steady despite ongoing inflows and outflows, which requires inflows to equal outflows."},
{q:"A savings balance grows faster the larger it gets, because interest compounds. This is which kind of loop?",o:["Balancing (negative) \u2014 it opposes change","Reinforcing (positive) \u2014 it amplifies the direction of change","Linear \u2014 constant proportion","Neither; it is a stock, not a loop"],a:1,e:"Pp. 210\u2013211: a reinforcing loop is self-enhancing (a virtuous circle here), amplifying rather than opposing change."},
{q:"'Bounded rationality' names\u2026",o:["A decision that is optimal for the whole system","Logic that makes sense within one part of a system but not for the wider whole","A perfectly informed rational actor","The boundary drawn around a system"],a:1,e:"P. 210: bounded rationality leads to actions reasonable within one part yet unreasonable in the broader context."}
]},

{id:"m8l2",title:"The Systems Principles, All at Once",pages:"pp. 211\u2013214",
obj:["Recall the through-line principles that recur across the whole book","Explain why structure (not events) is the source of behavior","Apply principles about limits, delays, and boundaries to a novel case"],
html:`
<p>The appendix gathers the book's recurring principles into one summary. Read as a whole, they stop being separate facts and start sounding like a single worldview. This lesson pulls the load-bearing ones together.</p>

<h3>Structure produces behavior</h3>
<p>The deepest claim: <b>system structure is the source of system behavior</b>, and that behavior shows up as a series of events over time. A system is more than the sum of its parts, and its least visible part \u2014 its function or purpose \u2014 is often the most crucial determinant of what it does. Systems with similar feedback structures produce similar dynamic behaviors, which is why the same handful of patterns keep reappearing across wildly different domains.</p>

<h3>Stocks, flows, and loops</h3>
<p>Stocks rise when inflows exceed outflows and fall when outflows exceed inflows \u2014 and you can raise a stock by <em>cutting its outflow</em>, not only by boosting its inflow. Stocks act as buffers and delays, decoupling inflows from outflows. Balancing loops are sources of both stability and resistance to change; reinforcing loops drive exponential growth or runaway collapse. And feedback can only affect <b>future</b> behavior \u2014 it can never arrive fast enough to correct the behavior that already drove it. A delay in a balancing loop makes a system likely to oscillate.</p>

<h3>Limits, boundaries, and surprise</h3>
<p>No system can grow forever in a finite environment, so exponential growth always needs both a reinforcing loop driving it and a balancing loop that will eventually constrain it. Nonrenewable resources are <b>stock-limited</b>; renewable ones are <b>flow-limited</b>. There are no separate systems \u2014 the world is a continuum, so where you draw a boundary depends on your purpose. Every entity sits inside layers of limits, and at any moment the most important input is the one that's currently most limiting. A quantity growing exponentially toward a limit reaches it in a surprisingly short time. And, humblingly: everything we think we know about the world is a model \u2014 congruent enough with reality to be useful, yet always far short of representing it fully.</p>

<div class="note"><b>Why this matters:</b> the principles cohere into one habit of mind \u2014 look past events to structure, expect nonlinearity and delay, respect limits, and hold your models lightly.</div>
`,
quiz:[
{q:"The principle 'system structure is the source of system behavior' means that\u2026",o:["Events are random and unexplainable","Recurring behavior patterns arise from the system's structure, not from isolated events or actors","Only the largest part of a system matters","Behavior has no relation to structure"],a:1,e:"Pp. 211\u2013212: structure generates behavior, which appears as events over time \u2014 so similar structures produce similar dynamics."},
{q:"According to the summary, a stock can be increased by\u2026",o:["Only increasing its inflow","Either increasing its inflow or decreasing its outflow","Only adding a reinforcing loop","Removing all feedback"],a:1,e:"P. 212: a stock can be increased by decreasing its outflow rate as well as by increasing its inflow rate."},
{q:"A fishery (renewable) and a copper deposit (nonrenewable) differ in that\u2026",o:["Both are stock-limited","The copper is stock-limited while the fishery is flow-limited","Both are flow-limited","Neither faces any limit"],a:1,e:"P. 213: nonrenewable resources are stock-limited; renewable resources are flow-limited."},
{q:"Why does the summary insist there are 'no separate systems'?",o:["Because all systems are identical","Because the world is a continuum, so a boundary is a choice that depends on the purpose of the discussion","Because systems never interact","Because boundaries are fixed by nature"],a:1,e:"P. 214: the world is continuous, so where to draw a boundary depends on the purpose, not on a real dividing line."}
]},

{id:"m8l3",title:"The Eight Traps at a Glance",pages:"pp. 214\u2013217",
obj:["Match each system trap to its structural signature","Match each trap to its prescribed way out","Diagnose which trap a novel situation exemplifies"],
html:`
<p>The appendix compresses Chapter Five's eight traps into a trap-and-way-out reference. Having worked through each in Module 5, use this as a fast diagnostic table \u2014 the point is to recognize a trap in the wild and recall its exit.</p>

<table class="cmp"><tr><th>Trap</th><th>Structural signature</th><th>The way out</th></tr>
<tr><td>Policy resistance</td><td>Actors pull a shared stock toward conflicting goals; effective policy only provokes more resistance</td><td>Let go; align actors around a larger shared goal</td></tr>
<tr><td>Tragedy of the commons</td><td>Weak feedback from a shared, erodable resource to its users; each gains, all share the cost</td><td>Educate; restore the missing feedback by privatizing or regulating</td></tr>
<tr><td>Drift to low performance</td><td>A downbeat perception lets the goal slip with past performance \u2014 eroding goals</td><td>Keep standards absolute; anchor the goal to best performance</td></tr>
<tr><td>Escalation</td><td>Each stock's state is set by trying to surpass another's \u2014 an exponential reinforcing race</td><td>Refuse to compete (unilaterally disarm) or negotiate balancing loops</td></tr>
<tr><td>Success to the successful</td><td>Winners are rewarded with the means to win again; winners take all</td><td>Diversify; limit any winner's share; level the playing field</td></tr>
<tr><td>Shifting the burden (addiction)</td><td>A fix relieves symptoms while the system's own capacity atrophies, demanding ever more of the fix</td><td>Avoid it; restore the system's own capability, then withdraw</td></tr>

{id:"m8l4",title:"From Model to Equations",pages:"pp. 218\u2013227",
obj:["Explain how a stock-and-flow diagram translates into runnable equations","Describe the roles of stock, flow, converter, and time step (dt)","Recognize what a system-dynamics model can and cannot tell you"],
html:`
<p>The final appendix section shows how the book's nine models were actually built \u2014 the equations behind the bathtub, the cooling coffee, the population, and the rest, written to translate into modeling software like STELLA or Vensim. You don't need a computer to learn systems thinking, Meadows notes, but once you've watched even simple systems behave, you may want to build formal models of your own. This lesson explains the <em>shape</em> of that translation using an original worked example; the appendix itself holds the full equation set for each model.</p>

<h3>The four ingredients</h3>
<p>Every model in the book is assembled from the same pieces. A <span class="kw">stock</span> accumulates; each step, its new value is its old value plus the net flow times the time interval. A <span class="kw">flow</span> is a rate \u2014 how fast the stock fills or drains. A <span class="kw">converter</span> is either a constant or a quantity calculated from other elements (a room temperature, a discrepancy, a goal). And the <span class="kw">time step</span> (written <em>dt</em>) is how much simulated time passes between calculations \u2014 recompute the flows, update the stock, repeat.</p>

<h3>A worked bathtub</h3>
<p>Take the simplest model. The stock is the water level; the inflow is the faucet, the outflow the drain. In words, each minute: <em>new level = old level + (inflow \u2212 outflow) \u00d7 one minute</em>. Give it a starting level, hold the faucet at zero for five minutes then open it, keep the drain steady, and step it forward minute by minute \u2014 and you reproduce exactly the rising-and-falling curve from Chapter One. A cooling-coffee model works the same way, except the outflow isn't constant: it's a converter, calculated as the <em>discrepancy</em> between coffee and room temperature times a cooling fraction, so the coffee cools fast when it's hot and slowly as it nears room temperature. That single change \u2014 a flow driven by the stock's own state \u2014 is what turns a straight drain into a balancing feedback loop.</p>

<div class="fig"><svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans,system-ui,sans-serif">
<defs><marker id="ah16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#116963"/></marker></defs>
<rect x="270" y="70" width="160" height="60" rx="8" fill="#E6F1EF" stroke="#116963" stroke-width="1.6"/><text x="350" y="95" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="700">STOCK</text><text x="350" y="114" text-anchor="middle" font-size="10.5" fill="#7A828C">level(t) = level(t\u2212dt) + net\u00d7dt</text>
<rect x="40" y="80" width="130" height="40" rx="8" fill="#fff" stroke="#E4E7E2"/><text x="105" y="104" text-anchor="middle" font-size="11" fill="#1C2128">inflow (rate)</text>
<rect x="530" y="80" width="130" height="40" rx="8" fill="#fff" stroke="#E4E7E2"/><text x="595" y="104" text-anchor="middle" font-size="11" fill="#1C2128">outflow (rate)</text>
<rect x="270" y="155" width="160" height="38" rx="8" fill="#FBF3E1" stroke="#D9930D"/><text x="350" y="179" text-anchor="middle" font-size="10.5" fill="#1C2128">converter (constant or calc)</text>
<g stroke="#116963" stroke-width="1.6" fill="none" marker-end="url(#ah16)">
<line x1="170" y1="100" x2="268" y2="100"/><line x1="430" y1="100" x2="528" y2="100"/>
<line x1="350" y1="155" x2="350" y2="132"/></g>
<text x="220" y="70" text-anchor="middle" font-size="10" fill="#7A828C">fills</text>
<text x="480" y="70" text-anchor="middle" font-size="10" fill="#7A828C">drains</text>
</svg><div class="fig-cap">Every model in the book is this shape: a stock updated each dt by its net flow, with flows sometimes driven by converters \u2014 which is how feedback enters.</div></div>

<h3>What a model is for</h3>
<p>Crucially, these models <b>explore possible futures</b> and ask "what if" \u2014 they do not predict. Their usefulness doesn't depend on whether the driving scenario is realistic (no one can know that), but on whether the model responds with a <em>realistic pattern of behavior</em>. That is the humble, honest role of a system-dynamics model, and it echoes the book's closing theme: not prediction and control, but understanding and design.</p>

<div class="note"><b>Why this matters:</b> the leap from diagram to equations is smaller than it looks \u2014 stock, flow, converter, and dt are the whole grammar. And a model earns its keep by reproducing the <em>shape</em> of behavior, not by forecasting the future.</div>
`,

function buildClassify(el){
  const ex = EXERCISES[el.dataset.classify];
  if(!ex || el.dataset.built) return;
  el.dataset.built = "1";
  el.innerHTML = `<div class="cls">
    <div class="cls-head">Exercise · ${ex.head}</div><div class="cls-sub">${ex.sub}</div>
    <div class="cls-pool">${ex.items.map((it,i)=>`<button class="chip" data-i="${i}">${it[0]}</button>`).join('')}</div>
    <div class="cls-buckets">${ex.buckets.map((b,bi)=>`<div class="bucket" data-b="${bi}"><h5>${b}</h5><div class="bchips"></div></div>`).join('')}</div>
    <div class="cls-actions"><button class="btn btn-primary" data-act="check">Check</button>
    <button class="btn btn-ghost" data-act="reset">Reset</button><span class="cls-result"></span></div></div>`;

  let sel = null;
  const root = el.querySelector('.cls');
  const result = root.querySelector('.cls-result');
  const clearMarks = () => root.querySelectorAll('.chip').forEach(c=>c.classList.remove('right','wrongc'));

  root.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    const bucket = e.target.closest('.bucket');
    const act = e.target.dataset && e.target.dataset.act;

    if(act === 'reset'){
      const pool = root.querySelector('.cls-pool');
      root.querySelectorAll('.bchips .chip').forEach(c=>pool.appendChild(c));
      clearMarks(); result.textContent=''; sel=null;
      root.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
      root.querySelectorAll('.bucket').forEach(b=>b.classList.remove('target'));
      return;
    }
    if(act === 'check'){
      const placed = root.querySelectorAll('.bchips .chip').length;
      if(placed < ex.items.length){ result.className='cls-result no'; result.textContent='Place all items first.'; return; }
      let ok = 0;
      root.querySelectorAll('.bucket').forEach(b => {
        const bi = +b.dataset.b;
        b.querySelectorAll('.chip').forEach(c => {
          const good = ex.items[+c.dataset.i][1] === bi;
          c.classList.add(good ? 'right' : 'wrongc');
          if(good) ok++;
        });
      });
      result.className = 'cls-result ' + (ok===ex.items.length?'ok':'no');
      result.textContent = ok===ex.items.length ? `${ok}/${ex.items.length} — perfect.` : `${ok}/${ex.items.length} — tap the red items to return them and try again.`;
      return;
    }
    if(chip){
      if(chip.closest('.bchips')){ root.querySelector('.cls-pool').appendChild(chip); chip.classList.remove('right','wrongc','sel'); sel=null; }
      else{
        root.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
        sel = (sel===chip) ? null : chip;
        if(sel) chip.classList.add('sel');
      }
      root.querySelectorAll('.bucket').forEach(b=>b.classList.toggle('target', !!sel));
      return;
    }
    if(bucket && sel){
      bucket.querySelector('.bchips').appendChild(sel);
      sel.classList.remove('sel'); sel=null; clearMarks(); result.textContent='';
      root.querySelectorAll('.bucket').forEach(b=>b.classList.remove('target'));
    }
  });
}

/* ---- bathtub stock-and-flow simulator ---- */
function fmt(n){
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return Math.round(n)+'';
}
function buildTub(){
  const el = document.getElementById('sim-tub');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 one stock, one inflow, one outflow</div>
  <div class="sim-sub">A simplified bathtub (200 L capacity, no evaporation \u2014 like the book's model). Set the faucet and drain, watch 30 minutes of the stock's behavior. Can you find dynamic equilibrium?</div>
  <div class="sim-controls">
    <div><label>Inflow \u2014 faucet (L/min) <output id="tb-in-o"></output></label><input type="range" id="tb-in" min="0" max="20" step="1" value="0" oninput="tubCalc()"></div>
    <div><label>Outflow \u2014 drain (L/min) <output id="tb-out-o"></output></label><input type="range" id="tb-out" min="0" max="20" step="1" value="8" oninput="tubCalc()"></div>
    <div><label>Starting level (L) <output id="tb-l0-o"></output></label><input type="range" id="tb-l0" min="0" max="200" step="10" value="120" oninput="tubCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="tb-net"></div><div class="l">net flow (in \u2212 out)</div></div>
    <div class="stat"><div class="v" id="tb-end"></div><div class="l">level after 30 min</div></div>
  </div>
  <div class="hist" id="tb-hist"></div>
  <div class="verdict" id="tb-verdict"></div></div>`;
  tubCalc();
}
function tubCalc(){
  const fin = +document.getElementById('tb-in').value;
  const fout = +document.getElementById('tb-out').value;
  const l0 = +document.getElementById('tb-l0').value;
  document.getElementById('tb-in-o').textContent = fin+' L/min';
  document.getElementById('tb-out-o').textContent = fout+' L/min';
  document.getElementById('tb-l0-o').textContent = l0+' L';
  const CAP=200, T=30, N=60, dt=T/N;
  let lvl=l0, levels=[], emptied=-1, filled=-1;
  for(let i=0;i<=N;i++){
    levels.push(lvl);
    const out = lvl>0 ? fout : 0;               // drain can't pull from an empty tub
    const inn = lvl<CAP ? fin : Math.min(fin,fout); // overflow spills, level caps
    lvl = Math.max(0, Math.min(CAP, lvl + (inn-out)*dt));
    if(emptied<0 && lvl<=0 && (fout>fin)) emptied = (i+1)*dt;
    if(filled<0 && lvl>=CAP && (fin>fout)) filled = (i+1)*dt;
  }
  const net = fin-fout;
  document.getElementById('tb-net').textContent = (net>0?'+':'')+net+' L/min';
  document.getElementById('tb-end').textContent = Math.round(levels[N])+' L';
  document.getElementById('tb-hist').innerHTML = levels.map(v=>'<div style="height:'+Math.max(1,100*v/CAP)+'%"></div>').join('');
  const v = document.getElementById('tb-verdict');
  v.className='verdict';
  if(net>0 && filled>0){
    v.innerHTML = 'Inflow exceeds outflow, so the stock rises \u2014 and overflows at ~<b>'+Math.round(filled)+' min</b>. Notice it still took time: a stock can only change at the pace of its flows.';
  } else if(net>0){
    v.innerHTML = 'Sum of inflows exceeds sum of outflows \u2192 the stock <b>rises</b>, no exceptions. Only the sign of (in \u2212 out) decides the direction.';
  } else if(net<0 && emptied>0){
    v.innerHTML = 'Outflow exceeds inflow, so the stock falls \u2014 empty at ~<b>'+Math.round(emptied)+' min</b>. Even with the drain wide open, it couldn\u2019t empty instantly: flows take time to flow.';
  } else if(net<0){
    v.innerHTML = 'Outflow exceeds inflow \u2192 the stock <b>falls</b>. To reverse this you could raise the inflow \u2014 or just close the drain a little. There\u2019s more than one way to fill a bathtub.';
  } else if(fin===0){
    v.innerHTML = 'No flows at all: an unchanging, undynamic, boring system \u2014 the plugged tub before the thought experiment begins.';
  } else {
    v.innerHTML = '<b>Dynamic equilibrium.</b> The level is frozen at whatever it was when the flows matched \u2014 yet '+fin+' L of water streams through every minute. An unchanging stock does not mean nothing is flowing.';
  }
}

/* ---- population growth/decline simulator (module 2) ---- */
function buildPop(){
  const el = document.getElementById('sim-pop');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 one reinforcing loop vs. one balancing loop</div>
  <div class="sim-sub">A simplified population model with constant rates, starting from the book's 2007 world: 6.6 billion people. Which loop dominates? Try making neither dominate.</div>
  <div class="sim-controls">
    <div><label>Fertility (births / 1,000 / yr) <output id="pp-b-o"></output></label><input type="range" id="pp-b" min="5" max="45" step="1" value="21" oninput="popCalc()"></div>
    <div><label>Mortality (deaths / 1,000 / yr) <output id="pp-d-o"></output></label><input type="range" id="pp-d" min="5" max="45" step="1" value="9" oninput="popCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="pp-net"></div><div class="l">net growth / yr</div></div>
    <div class="stat"><div class="v" id="pp-end"></div><div class="l">population in 60 yrs</div></div>
    <div class="stat"><div class="v" id="pp-dbl"></div><div class="l" id="pp-dbl-l">doubling time</div></div>
  </div>
  <div class="hist" id="pp-hist"></div>
  <div class="verdict" id="pp-verdict"></div></div>`;
  popCalc();
}
function popCalc(){
  const b = +document.getElementById('pp-b').value;
  const d = +document.getElementById('pp-d').value;
  document.getElementById('pp-b-o').textContent = b;
  document.getElementById('pp-d-o').textContent = d;
  const r = (b-d)/1000;
  let pop = 6.6e9, levels=[];
  for(let y=0;y<=60;y++){ levels.push(pop); pop *= (1+r); }
  const mx = Math.max(...levels);
  document.getElementById('pp-net').textContent = (r>0?'+':'')+(r*100).toFixed(1)+'%';
  document.getElementById('pp-end').textContent = fmt(levels[60]);
  const dblEl = document.getElementById('pp-dbl'), dblL = document.getElementById('pp-dbl-l');
  if(r>0.0005){ dblEl.textContent = Math.round(70/(r*100))+' yrs'; dblL.textContent='doubling time (70 \u00f7 rate)'; }
  else if(r<-0.0005){ dblEl.textContent = Math.round(70/Math.abs(r*100))+' yrs'; dblL.textContent='halving time (70 \u00f7 rate)'; }
  else { dblEl.textContent='\u2014'; dblL.textContent='neither doubles nor halves'; }
  document.getElementById('pp-hist').innerHTML = levels.map(v=>'<div style="height:'+Math.max(1,100*v/mx)+'%"></div>').join('');
  const v = document.getElementById('pp-verdict'); v.className='verdict';
  if(r>0.0005){
    const mult = (levels[60]/6.6e9);
    v.innerHTML = 'The <b>reinforcing birth loop dominates</b>: exponential growth, '+mult.toFixed(1)+'\u00d7 in 60 years'+(b===21&&d===9?' \u2014 the book\u2019s 2007 rates, under which a child born then sees the population more than double by age 60.':'.')+' Note the curve bends upward: the more people, the more births.';
  } else if(r<-0.0005){
    v.innerHTML = 'The <b>balancing death loop dominates</b>: the population declines toward die-off \u2014 the book\u2019s disease scenario (mortality at 30 with fertility at 21) behaves this way. Same structure, opposite dominance.';
  } else {
    v.innerHTML = '<b>Neither loop dominates.</b> Births exactly balance deaths and the stock holds in dynamic equilibrium \u2014 the plateau the UN scenario reaches if fertility falls to meet mortality. With constant rates, growth, decline, and leveling are the only three behaviors this structure can produce.';
  }
}

/* ---- inventory oscillation simulator (module 2) ---- */
function buildInv(){
  const el = document.getElementById('sim-inv');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 delays in a balancing loop</div>
  <div class="sim-sub">The car dealership, simplified: demand steps up 10% on day 25 and the dealer restocks toward 10 days\u2019 coverage. Adjust her three delays. Try to damp the oscillation \u2014 then try reacting faster and watch what happens.</div>
  <div class="sim-controls">
    <div><label>Perception delay \u2014 days averaged <output id="iv-p-o"></output></label><input type="range" id="iv-p" min="1" max="10" step="1" value="5" oninput="invCalc()"></div>
    <div><label>Response time \u2014 days to correct shortfall <output id="iv-r-o"></output></label><input type="range" id="iv-r" min="1" max="10" step="1" value="3" oninput="invCalc()"></div>
    <div><label>Delivery delay from factory <output id="iv-d-o"></output></label><input type="range" id="iv-d" min="1" max="10" step="1" value="5" oninput="invCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="iv-low"></div><div class="l">deepest dip (target 110)</div></div>
    <div class="stat"><div class="v" id="iv-high"></div><div class="l">highest overshoot</div></div>
    <div class="stat"><div class="v" id="iv-amp"></div><div class="l">late-run swing</div></div>
  </div>
  <div class="hist" id="iv-hist"></div>
  <div class="verdict" id="iv-verdict"></div></div>`;
  invCalc();
}
function invCalc(){
  const P = +document.getElementById('iv-p').value;
  const R = +document.getElementById('iv-r').value;
  const D = +document.getElementById('iv-d').value;
  document.getElementById('iv-p-o').textContent = P+'d';
  document.getElementById('iv-r-o').textContent = R+'d';
  document.getElementById('iv-d-o').textContent = D+'d';
  const T=120, COV=10;
  let inv=100, sales=[], pipe=new Array(D).fill(10), invs=[];
  for(let t=0;t<T;t++){
    const demand = t<25 ? 10 : 11;
    const sold = Math.min(inv, demand);
    sales.push(sold);
    const recent = sales.slice(-P);
    const perceived = recent.reduce((a,c)=>a+c,0)/recent.length;
    const desired = COV*perceived;
    const order = Math.max(0, perceived + (desired-inv)/R);
    pipe.push(order);
    const delivered = pipe.shift();
    inv = Math.max(0, inv + delivered - sold);
    invs.push(inv);
  }
  const after = invs.slice(25);
  const lo = Math.min(...after), hi = Math.max(...after);
  const late = invs.slice(70);
  const amp = Math.max(...late)-Math.min(...late);
  document.getElementById('iv-low').textContent = Math.round(lo);
  document.getElementById('iv-high').textContent = Math.round(hi);
  document.getElementById('iv-amp').textContent = '\u00b1'+Math.round(amp/2);
  const mx = Math.max(...invs, 130);
  document.getElementById('iv-hist').innerHTML = invs.map(v=>'<div style="height:'+Math.max(1,100*v/mx)+'%"></div>').join('');
  const v = document.getElementById('iv-verdict');
  if(amp > 60){
    v.className='verdict melt';
    v.innerHTML = 'Violent, persistent oscillation \u2014 each correction lands after the situation has changed, so the dealer chronically overshoots. If you got here by shortening the response time: <b>high leverage, wrong direction</b>. Acting faster makes a delayed balancing loop swing harder.';
  } else {
    v.className='verdict';
    if(amp < 4) v.innerHTML = 'Nicely damped \u2014 inventory settles at the new target (110 \u2248 10 days \u00d7 11 sales) with barely a wobble. Notice the fix was usually <b>slowing the response</b>, not speeding it up, and that the delivery delay you can\u2019t control still didn\u2019t prevent good management.';
    else v.innerHTML = 'The step in demand triggers oscillations around the new target before settling \u2014 the delays mean the dealer\u2019s actions are always answering yesterday\u2019s problem. A delay in a balancing feedback loop makes a system likely to oscillate. Try a longer response time to damp it \u2014 or a shorter one, if you dare.';
  }
}

/* ---- nonlinear fertilizer-yield simulator (module 4) ---- */
function buildFert(){
  const el = document.getElementById('sim-fert');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 a nonlinear relationship</div>
  <div class="sim-sub">Meadows\u2019 fertilizer curve: a little helps, more helps less, too much poisons the soil and yield falls. A simplified model \u2014 slide the dose and watch a linear mind\u2019s expectation break.</div>
  <div class="sim-controls">
    <div><label>Fertilizer applied (lb) <output id="ft-x-o"></output></label><input type="range" id="ft-x" min="0" max="320" step="10" value="30" oninput="fertCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="ft-y"></div><div class="l">yield change (bushels)</div></div>
    <div class="stat"><div class="v" id="ft-lin"></div><div class="l">a linear mind expects</div></div>
  </div>
  <div class="hist" id="ft-hist"></div>
  <div class="verdict" id="ft-verdict"></div></div>`;
  fertCalc();
}
function fertYield(x){
  // low dose ~ linear (0.2/lb near origin); peak ~150lb; turns down and poisons past ~200
  return 0.2*x - 0.0000135*x*x*x/1;
}
function fertCalc(){
  const x = +document.getElementById('ft-x').value;
  document.getElementById('ft-x-o').textContent = x+' lb';
  const y = fertYield(x);
  const lin = 0.2*x; // naive extrapolation from the small-dose slope
  document.getElementById('ft-y').textContent = (y>=0?'+':'')+y.toFixed(1);
  document.getElementById('ft-lin').textContent = '+'+lin.toFixed(1);
  // curve bars across full range, marker at current x
  let bars=''; const ymax=12, ymin=-8;
  for(let d=0; d<=320; d+=10){
    const yy = fertYield(d);
    const h = 100*(yy-ymin)/(ymax-ymin);
    const cur = (d===x);
    bars += '<div style="height:'+Math.max(1,h)+'%;background:'+(cur?'var(--accent-strong,#0d514c)':(yy<0?'#B3452E':'var(--accent,#116963)'))+'"></div>';
  }
  document.getElementById('ft-hist').innerHTML = bars;
  const v = document.getElementById('ft-verdict'); v.className='verdict';
  if(x<=110){
    v.innerHTML = 'In this range more really does mean more \u2014 roughly proportional. This is the stretch that trains our linear intuition: a small push, a small response.';
  } else if(y>0 && x<=200){
    v.innerHTML = 'The curve is bending. Yield is still rising but each extra pound adds less than the last \u2014 the linear prediction ('+'+'+lin.toFixed(1)+') now overstates reality. Twice the push is no longer twice the response.';
  } else {
    v.className='verdict melt';
    v.innerHTML = 'Too much of a good thing: the soil is damaged and yield is <b>falling</b>. A linear mind still expects +'+lin.toFixed(1)+' bushels; the nonlinear world delivers '+y.toFixed(1)+'. This reversal is exactly the kind of surprise nonlinearities produce.';
  }
}

/* ---- Liebig limiting-factor simulator (module 4) ---- */
function buildLim(){

  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 the law of the minimum</div>
  <div class="sim-sub">Grain growth depends on three nutrients, but only the scarcest one sets the yield. Pour on more of a nutrient that isn\u2019t limiting and nothing happens \u2014 find the bottleneck instead.</div>
  <div class="sim-controls">
    <div><label>Nitrogen <output id="lm-n-o"></output></label><input type="range" id="lm-n" min="0" max="100" step="5" value="80" oninput="limCalc()"></div>
    <div><label>Phosphorus <output id="lm-p-o"></output></label><input type="range" id="lm-p" min="0" max="100" step="5" value="30" oninput="limCalc()"></div>
    <div><label>Potassium <output id="lm-k-o"></output></label><input type="range" id="lm-k" min="0" max="100" step="5" value="90" oninput="limCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="lm-y"></div><div class="l">yield (% of potential)</div></div>
    <div class="stat"><div class="v" id="lm-lim"></div><div class="l">limiting factor</div></div>
  </div>
  <div class="hist" id="lm-hist"></div>
  <div class="verdict" id="lm-verdict"></div></div>`;
  limCalc();
}
function limCalc(){
  const n=+document.getElementById('lm-n').value, p=+document.getElementById('lm-p').value, k=+document.getElementById('lm-k').value;
  document.getElementById('lm-n-o').textContent=n; document.getElementById('lm-p-o').textContent=p; document.getElementById('lm-k-o').textContent=k;
  const vals=[['Nitrogen',n],['Phosphorus',p],['Potassium',k]];
  const y=Math.min(n,p,k);
  const lim=vals.filter(z=>z[1]===y).map(z=>z[0]);
  document.getElementById('lm-y').textContent=y+'%';
  document.getElementById('lm-lim').textContent= lim.join(' & ');
  // bars: each nutrient, capped visually at yield line
  const bar=(name,val)=> {
    const limiting = val===y;
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:4px">'+
      '<div style="width:100%;height:80px;display:flex;align-items:flex-end"><div style="width:100%;height:'+Math.max(2,val)+'%;background:'+(limiting?'#B3452E':'var(--accent,#116963)')+';border-radius:4px 4px 0 0"></div></div>'+
      '<div style="font-size:11px;color:var(--text-muted,#7A828C)">'+name+'</div></div>';
  };
  document.getElementById('lm-hist').innerHTML =
    '<div style="display:flex;gap:12px;width:100%;align-items:flex-end;height:110px">'+bar('N',n)+bar('P',p)+bar('K',k)+'</div>';
  const v=document.getElementById('lm-verdict'); v.className='verdict';
  const others=vals.filter(z=>z[1]!==y);
  const maxOther=Math.max(...vals.map(z=>z[1]));
  if(maxOther-y>=30 && y<100){
    v.innerHTML = '<b>'+lim.join(' and ')+'</b> is limiting yield to '+y+'%. Notice you could crank the other nutrients to the maximum and yield would not move \u2014 it does no good to pour on more of what isn\u2019t short. Raise <b>'+lim[0]+'</b> instead.';
  } else if(y>=100){
    v.innerHTML = 'All three are abundant \u2014 yield is at its potential. Now some <em>other</em> factor (water, sunlight, soil microbes) would become the binding constraint. There are always layers of limits.';
  } else {
    v.innerHTML = '<b>'+lim.join(' and ')+'</b> currently sets the ceiling at '+y+'%. The most important input to the system is whichever one is most limiting \u2014 raise that one to raise the yield.';
  }
}

/* ---- tragedy of the commons simulator (module 5) ---- */
function buildCommons(){
  const el = document.getElementById('sim-commons');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 an erodable shared pasture</div>
  <div class="sim-sub">A simplified commons (no privatization, no regulation \u2014 just the raw structure). Each herder follows bounded rationality: if there\u2019s grass, add a cow. More herders means faster stocking. The pasture regrows, but once grazed past a threshold it erodes. Try to find a herd the pasture can sustain \u2014 then add more herders and watch.</div>
  <div class="sim-controls">
    <div><label>Number of herders <output id="cm-h-o"></output></label><input type="range" id="cm-h" min="1" max="40" step="1" value="6" oninput="commonsCalc()"></div>
    <div><label>Pasture regrowth rate <output id="cm-g-o"></output></label><input type="range" id="cm-g" min="1" max="12" step="1" value="6" oninput="commonsCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="cm-cows"></div><div class="l">peak herd size</div></div>
    <div class="stat"><div class="v" id="cm-end"></div><div class="l">pasture left at end</div></div>
    <div class="stat"><div class="v" id="cm-fate"></div><div class="l">outcome</div></div>
  </div>
  <div class="hist" id="cm-hist"></div>
  <div class="verdict" id="cm-verdict"></div></div>`;
  commonsCalc();
}
function commonsCalc(){
  const H = +document.getElementById('cm-h').value;   // herders
  const g = +document.getElementById('cm-g').value/100; // regrowth fraction
  document.getElementById('cm-h-o').textContent = H;
  document.getElementById('cm-g-o').textContent = (g*100).toFixed(0)+'%';
  const CAP=100;              // pasture carrying capacity (grass units)
  const THRESH=25;            // erosion threshold: below this, regrowth is crippled
  const T=60;                 // months
  let grass=CAP, cows=H, levels=[], peak=cows, collapsed=-1;
  for(let t=0;t<=T;t++){
    levels.push(grass);
    // each herder adds a cow while grass looks plentiful (no feedback restraint)
    if(grass>THRESH) cows += H*0.04;
    // grazing pressure eats grass in proportion to herd
    const graze = cows*0.5;
    // regrowth: logistic, but crippled once eroded below threshold
    const health = grass>THRESH ? 1 : Math.max(0, grass/THRESH);
    const regrow = g*grass*(1-grass/CAP)*4*health;
    grass = Math.max(0, Math.min(CAP, grass + regrow - graze));
    if(grass<THRESH) cows = Math.max(H, cows*0.97); // starving herd shrinks slowly
    if(collapsed<0 && grass<=1) collapsed = t;
    peak = Math.max(peak, cows);
  }
  document.getElementById('cm-cows').textContent = Math.round(peak);
  document.getElementById('cm-end').textContent = Math.round(levels[T])+'%';
  const mx = CAP;
  document.getElementById('cm-hist').innerHTML = levels.map(v=>'<div style="height:'+Math.max(1,100*v/mx)+'%"></div>').join('');
  const fateEl = document.getElementById('cm-fate');
  const v = document.getElementById('cm-verdict'); v.className='verdict';
  if(levels[T]<=2 || collapsed>0){
    fateEl.textContent='ruined';
    v.className='verdict melt';
    v.innerHTML = 'The pasture <b>collapsed</b>'+(collapsed>0?' around month '+collapsed:'')+'. With no feedback from the grass to the herders, stocking outran regrowth, grazing pushed the pasture past its erosion threshold, and the downhill loop finished it \u2014 ruining every herder. Bounded rationality in a nutshell.';
  } else if(levels[T]<THRESH){
    fateEl.textContent='eroding';
    v.innerHTML = 'The pasture is <b>degrading</b> \u2014 below the erosion threshold, regrowth is crippled and the herd is starting to starve. Fewer herders or faster regrowth might still save it, but the missing feedback is dragging it downhill.';
  } else {
    fateEl.textContent='holding';
    v.innerHTML = 'The pasture is <b>holding</b>: at this herder count the grass regrows about as fast as it\u2019s grazed. But notice how fragile this is \u2014 nudge the herders up and the same structure tips into collapse, because nothing restrains any individual from adding one more cow.';
  }
}

/* ---- escalation / arms-race simulator (module 5) ---- */
function buildEscal(){
  const el = document.getElementById('sim-escal');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  el.innerHTML = `<div class="sim"><div class="sim-head">Simulator \u00b7 "I\u2019ll raise you one"</div>
  <div class="sim-sub">A simplified arms race between two rivals, each starting at 100. Every round each side sets its target above the other\u2019s current level and moves toward it. Adjust how far ahead each insists on staying, and whether one side unilaterally disarms. Watch how fast the levels explode \u2014 and what breaks the loop.</div>
  <div class="sim-controls">
    <div><label>How far ahead each tries to stay <output id="es-a-o"></output></label><input type="range" id="es-a" min="0" max="30" step="1" value="10" oninput="escalCalc()"></div>
    <div><label>One side unilaterally disarms? <output id="es-d-o"></output></label><input type="range" id="es-d" min="0" max="1" step="1" value="0" oninput="escalCalc()"></div>
  </div>
  <div class="sim-out">
    <div class="stat"><div class="v" id="es-end"></div><div class="l">levels after 20 rounds</div></div>
    <div class="stat"><div class="v" id="es-mult"></div><div class="l">growth vs. start</div></div>
  </div>
  <div class="hist" id="es-hist"></div>
  <div class="verdict" id="es-verdict"></div></div>`;
  escalCalc();
}
function escalCalc(){
  const ahead = +document.getElementById('es-a').value/100; // fraction each stays ahead
  const disarm = +document.getElementById('es-d').value;
  document.getElementById('es-a-o').textContent = (ahead*100).toFixed(0)+'%';
  document.getElementById('es-d-o').textContent = disarm? 'yes' : 'no';
  const N=20;
  let A=100, B=110, aLevels=[A], bLevels=[B];
  for(let i=0;i<N;i++){
    let targetA = B*(1+ahead);
    let targetB = A*(1+ahead);
    if(disarm){ targetA = A*0.85; }        // A refuses to compete, cuts its own level
    A = A + (targetA - A)*0.6;
    B = B + (targetB - B)*0.6;
    A=Math.max(0,A); B=Math.max(0,B);
    aLevels.push(A); bLevels.push(B);
  }
  const mx = Math.max(...aLevels, ...bLevels, 1);
  document.getElementById('es-end').textContent = Math.round(A)+' / '+Math.round(B);
  document.getElementById('es-mult').textContent = (Math.max(A,B)/100).toFixed(1)+'\u00d7';
  // interleaved two-color bars
  let html='';
  for(let i=0;i<aLevels.length;i++){
    html += '<div style="height:'+Math.max(1,100*aLevels[i]/mx)+'%"></div>';
    html += '<div class="b2" style="height:'+Math.max(1,100*bLevels[i]/mx)+'%"></div>';
  }
  document.getElementById('es-hist').innerHTML = html;
  const v = document.getElementById('es-verdict'); v.className='verdict';
  if(disarm){
    v.innerHTML = 'One side <b>unilaterally disarmed</b> \u2014 refusing to compete interrupts the reinforcing loop. Its rival, no longer chased, stops climbing too and the race deflates. Within the logic of escalation this move feels unthinkable, yet it\u2019s one of the only graceful ways out.';
  } else if(ahead<=0.005){
    v.innerHTML = 'With neither side trying to pull <em>ahead</em>, the levels merely converge and hold \u2014 there\u2019s no reinforcing loop, so nothing explodes. Escalation needs each side to top the other, not merely match it.';
  } else {
    const mult=(Math.max(A,B)/100);
    v.innerHTML = 'Each side insists on staying ahead, so both <b>explode exponentially</b> \u2014 '+mult.toFixed(1)+'\u00d7 in just 20 rounds \u2014 while the gap between them stays modest. That\u2019s the arms-race trap: no one ever gets far ahead, but the absolute levels race toward ruin until someone collapses.';
  }
}

  {t:"Expose your mental models to the light of day",g:0,d:"Make your assumptions visible and rigorous. Hold many hypotheses as plausible; rule them out only with evidence."},
  {t:"Honor, respect, and distribute information",g:1,d:"Most malfunctions come from biased, late, or missing information. Don't distort, delay, or withhold it \u2014 publishing alone can transform behavior."},
  {t:"Use language with care, enrich it with systems concepts",g:1,d:"We see only what we can talk about. Keep language truthful and concrete, and expand it to name complexity."},
  {t:"Pay attention to what is important, not just what is quantifiable",g:1,d:"Don't let the measurable crowd out the valuable. Be a quality detector; name justice, beauty, and their absence."},
  {t:"Make feedback policies for feedback systems",g:1,d:"Static rules can't govern dynamic systems. Design policies \u2014 and meta-policies \u2014 that adjust and learn as the system changes."},
  {t:"Go for the good of the whole",g:2,d:"Hierarchies serve their lower layers. Enhance whole-system properties \u2014 resilience, diversity, sustainability \u2014 not just one part."},
  {t:"Listen to the wisdom of the system",g:2,d:"Aid what already helps the system run itself. Don't be an unthinking intervenor who destroys its self-maintenance."},
  {t:"Locate responsibility in the system",g:2,d:"Design so consequences return directly to the decision maker \u2014 intrinsic responsibility, like a pilot in the front of the plane."},
  {t:"Stay humble \u2014 stay a learner",g:3,d:"When you don't know, don't bluff or freeze \u2014 learn. Small steps, constant monitoring, error-embracing."},
  {t:"Celebrate complexity",g:3,d:"The universe is messy, nonlinear, fractal. Encourage self-organization, variety, and diversity rather than forcing straight lines."},
  {t:"Expand time horizons",g:3,d:"Beware discount rates that excuse ignoring the future. Watch the next step and the far distance \u2014 the whole system in time."},
  {t:"Defy the disciplines",g:3,d:"Follow a system across every academic boundary. Go into learning mode; admit ignorance; discard each lens's distortions."},
  {t:"Expand the boundary of caring",g:3,d:"The system is interconnected, so moral and practical rules coincide. No part thrives while the parts it depends on fail."},
  {t:"Don't erode the goal of goodness",g:4,d:"Resist the eroding-goals trap for morality itself. Don't over-weight bad news; keep standards absolute."}
];
var DANCE_GROUPS = ["See clearly first","Tend the information","Serve the whole system","Meet complexity with humility","Hold the moral line"];
function buildDance(){
  const el = document.getElementById('sim-dance');
  if(!el || el.dataset.built) return; el.dataset.built="1";
  const rows = DANCE_LESSONS.map((p,i)=>
    '<button class="dl-row" data-i="'+i+'"><span class="dl-num">'+(i+1)+'</span><span class="dl-title">'+p.t+'</span></button>'
  ).join('');
  el.innerHTML = `<div class="sim"><div class="sim-head">Explore \u00b7 fifteen ways to dance with a system</div>
  <div class="sim-sub">Meadows's closing "systems wisdoms" \u2014 not a control panel but a dancing lesson. Tap any one to see what it asks of you. She notes the list isn't complete, because she was still a student in the school of systems.</div>
  <div class="dl-grid">${rows}</div>
  <div class="verdict" id="dl-detail">Tap any of the fifteen. Together they describe a stance: stay awake, pay attention, respond to feedback \u2014 and bring your full humanity, not just your ability to calculate.</div></div>`;
  const detail = el.querySelector('#dl-detail');
  el.querySelector('.dl-grid').addEventListener('click', e=>{
    const row = e.target.closest('.dl-row'); if(!row) return;
    el.querySelectorAll('.dl-row').forEach(r=>r.classList.remove('dl-active'));
    row.classList.add('dl-active');
    const p = DANCE_LESSONS[+row.dataset.i];
    detail.innerHTML = '<b>'+(+row.dataset.i+1)+'. '+p.t+'</b> \u2014 <span style="color:var(--ink-faint)">'+DANCE_GROUPS[p.g]+'</span><br>'+p.d;
  });
}

function initWidgets(){
  document.querySelectorAll('[data-classify]').forEach(buildClassify);
  buildTub();
  buildPop();
  buildInv();
  buildFert();
  buildLim();
  buildCommons();
  buildEscal();
  buildLadder();
  buildDance();
}

/* ---------------- app logic ---------------- */
const STORAGE_KEY = 'thinking-in-systems-progress';  // unique per course, NEVER change once shipped
const LESSONS = COURSE.flatMap(m => m.lessons);
let state = { completed:{}, answers:{}, missed:{} };
let reviewMode = false;
let reviewPicks = {};
let cur = 0;
let storageOK = false;

async function loadState(){
  try{
    if(window.storage){
      const r = await window.storage.get(STORAGE_KEY);
      if(r && r.value) state = JSON.parse(r.value);
      state.missed = state.missed || {};
      storageOK = true;
    }
  }catch(e){ storageOK = !!window.storage; } /* key missing = fine */
}
async function saveState(){
  if(!storageOK) return;
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function pct(){
  const done = LESSONS.filter(l => state.completed[l.id]).length;
  return Math.round(100 * done / LESSONS.length);
}

function renderTree(){
  const tree = document.getElementById('tree');
  tree.innerHTML = COURSE.map(m => `
    <div class="module">
      <div class="module-title">${m.title}</div>
      ${m.lessons.map(l => {
        const i = LESSONS.indexOf(l);
        const done = state.completed[l.id];
        return `<button class="lesson-link ${(!reviewMode && i===cur)?'active':''}" onclick="go(${i})">
          <span class="tick ${done?'done':''}">${done?'✓':''}</span><span>${l.title}</span></button>`;
      }).join('')}
    </div>`).join('');
  const p = pct();
  document.getElementById('progPct').textContent = p + '%';
  document.getElementById('progFill').style.width = p + '%';
  const m = Object.keys(state.missed).length;
  const rb = document.getElementById('reviewBtn');
  rb.textContent = m ? `Review missed questions (${m})` : 'Review — nothing missed yet';
  rb.disabled = !m;
}

function renderLesson(){
  const l = LESSONS[cur];
  const mod = COURSE.find(m => m.lessons.includes(l));
  const quizHtml = l.quiz.map((q,qi) => {
    const key = l.id + ':' + qi;
    const picked = state.answers[key];
    return `<div class="q-card">
      <div class="q-text">${qi+1}. ${q.q}</div>
      ${q.o.map((opt,oi) => {
        let cls = 'opt', dis = '';
        if(picked !== undefined){
          dis = 'disabled';
          if(oi === q.a) cls += ' correct';
          else if(oi === picked) cls += ' wrong';
        }
        return `<button class="${cls}" ${dis} onclick="answer('${l.id}',${qi},${oi})">${opt}</button>`;
      }).join('')}
      <div class="explain ${picked!==undefined?'show':''}">${q.e}</div>
    </div>`;
  }).join('');

  const answered = l.quiz.every((_,qi) => state.answers[l.id+':'+qi] !== undefined);
  const done = state.completed[l.id];

  document.getElementById('lesson').innerHTML = `
    <div class="crumb">${mod.title}</div>
    <h2 class="title">${l.title}</h2>
    <span class="pages-chip">Source: ${l.pages}</span>
    ${l.obj ? `<div class="objectives"><h4>After this lesson you can</h4><ul>${l.obj.map(o=>'<li>'+o+'</li>').join('')}</ul></div>` : ''}
    ${l.html}
    <div class="quiz">
      <div class="quiz-head">Check your understanding</div>
      <div class="quiz-sub">${l.quiz.length} question${l.quiz.length>1?'s':''} · answer all to complete the lesson</div>
      ${quizHtml}
    </div>
    <div class="lesson-nav">
      <button class="btn btn-ghost" onclick="go(${cur-1})" ${cur===0?'disabled':''}>← Previous</button>
      <span class="done-flag">${done ? '✓ Lesson complete' : ''}</span>
      <button class="btn btn-primary" onclick="completeAndNext()" ${answered?'':'disabled'}>
        ${cur === LESSONS.length-1 ? (done?'Finished!':'Complete course') : (done?'Next →':'Complete & next →')}
      </button>
    </div>`;
  initWidgets();
  window.scrollTo(0,0);
}

function go(i){
  if(i < 0 || i >= LESSONS.length) return;
  reviewMode = false;
  cur = i;
  renderTree(); renderLesson();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}

function answer(lid, qi, oi){
  const key = lid+':'+qi;
  const q = LESSONS.find(l => l.id === lid).quiz[qi];
  if(state.answers[key] === undefined && oi !== q.a) state.missed[key] = true;
  state.answers[key] = oi;
  saveState();
  renderLesson();
}

function completeAndNext(){
  state.completed[LESSONS[cur].id] = true;
  saveState();
  if(cur < LESSONS.length - 1) go(cur+1);
  else { renderTree(); renderLesson(); }
}


function goReview(){
  if(!Object.keys(state.missed).length) return;
  reviewMode = true; reviewPicks = {};
  renderTree(); renderReview();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}

function renderReview(){
  const keys = Object.keys(state.missed);
  if(!keys.length){
    document.getElementById('lesson').innerHTML = `
      <div class="crumb">Review</div><h2 class="title">All clear</h2>
      <p>No missed questions left — answer one correctly here and it leaves the review queue for good.</p>
      <div class="lesson-nav"><button class="btn btn-primary" onclick="go(cur)">Back to lessons →</button><span></span></div>`;
    window.scrollTo(0,0); return;
  }
  const cards = keys.map(key => {
    const [lid, qiS] = key.split(':'); const qi = +qiS;
    const l = LESSONS.find(x => x.id === lid); const q = l.quiz[qi];
    const picked = reviewPicks[key];
    return `<div class="q-card">
      <div class="crumb" style="margin-bottom:6px">${l.title}</div>
      <div class="q-text">${q.q}</div>
      ${q.o.map((opt,oi) => {
        let cls = 'opt';
        if(picked !== undefined && oi === picked) cls += ' wrong';
        return `<button class="${cls}" onclick="reviewAnswer('${lid}',${qi},${oi})">${opt}</button>`;
      }).join('')}
      <div class="explain ${picked!==undefined?'show':''}">Not quite — think about it and try another option. (Answer correctly to clear this question.)</div>
    </div>`;
  }).join('');
  document.getElementById('lesson').innerHTML = `
    <div class="crumb">Review mode</div>
    <h2 class="title">Missed questions</h2>
    <p>Questions you got wrong on first attempt, from across the course. Answer correctly to remove one from the queue — spaced retrieval is where retention actually happens.</p>
    ${cards}
    <div class="lesson-nav"><button class="btn btn-ghost" onclick="go(cur)">← Back to lessons</button><span></span></div>`;
  window.scrollTo(0,0);
}

function reviewAnswer(lid, qi, oi){
  const key = lid+':'+qi;
  const q = LESSONS.find(l => l.id === lid).quiz[qi];
  if(oi === q.a){ delete state.missed[key]; delete reviewPicks[key]; saveState(); }
  else reviewPicks[key] = oi;
  renderTree(); renderReview();
}

function toggleNav(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
}

loadState().then(() => {
  const firstUndone = LESSONS.findIndex(l => !state.completed[l.id]);
  cur = firstUndone === -1 ? 0 : firstUndone;
  renderTree(); renderLesson();
});

</script>
</body>
</html>
