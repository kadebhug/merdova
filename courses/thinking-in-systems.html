<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinking in Systems — Interactive Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F6; --card:#FFFFFF; --ink:#1C2128; --ink-soft:#4A525C; --ink-faint:#7A828C;
  --teal:#116963; --teal-dark:#0B4F4A; --teal-wash:#E6F1EF;
  --amber:#D9930D; --amber-wash:#FBF3E1;
  --good:#2E7D4F; --good-wash:#E9F4ED; --bad:#B3452E; --bad-wash:#F9ECE8;
  --line:#E4E7E2; --code-bg:#212832; --code-ink:#D8DEE6;
  --radius:10px; --sans:'Public Sans',system-ui,sans-serif; --slab:'Zilla Slab',Georgia,serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:304px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--slab);font-weight:700;font-size:19px;line-height:1.3;color:var(--teal-dark)}
.brand p{font-size:12px;color:var(--ink-faint);margin-top:2px}
.progress-wrap{padding:14px 20px;border-bottom:1px solid var(--line)}
.progress-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--amber);border-radius:3px;width:0%;transition:width .4s ease}
.module{padding:14px 0 4px}
.module-title{padding:0 20px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.lesson-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;padding:9px 20px;font-size:13.5px;color:var(--ink-soft);border-left:3px solid transparent}
.lesson-link:hover{background:var(--teal-wash)}
.lesson-link.active{background:var(--teal-wash);border-left-color:var(--teal);color:var(--teal-dark);font-weight:600}
.tick{width:17px;height:17px;flex-shrink:0;border:1.5px solid var(--line);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:var(--card)}
.tick.done{background:var(--good);border-color:var(--good)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;justify-content:center;padding:36px 24px 90px}
.lesson{max-width:720px;width:100%}
.crumb{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--teal)}
.lesson h2.title{font-family:var(--slab);font-weight:700;font-size:32px;line-height:1.2;margin:6px 0 10px}
.pages-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:26px}
.pages-chip::before{content:"§";color:var(--amber);font-weight:700}
.lesson h3{font-family:var(--slab);font-weight:600;font-size:21px;margin:34px 0 10px}
.lesson p{margin:0 0 14px;color:var(--ink)}
.lesson ul,.lesson ol{margin:0 0 14px 22px}
.lesson li{margin-bottom:7px}
.lesson strong{font-weight:600}
.kw{font-weight:600;color:var(--teal-dark)}
.lesson code{font-family:var(--mono);font-size:.86em;background:#EDEFEA;padding:1px 5px;border-radius:4px}
pre{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13px;line-height:1.6;padding:16px 18px;border-radius:var(--radius);overflow-x:auto;margin:0 0 16px}
pre code{background:none;padding:0;color:inherit;font-size:inherit}
.note{background:var(--amber-wash);border-left:3px solid var(--amber);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin:0 0 16px;font-size:14.5px}
.note b{color:#8A5D06}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.cmp th{background:var(--teal-wash);color:var(--teal-dark);text-align:left;padding:8px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
table.cmp td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.tradeoff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
.to-card{border-radius:var(--radius);padding:14px 16px;font-size:14px}
.to-card h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.to-card ul{margin-left:18px}
.to-card li{margin-bottom:5px}
.to-pro{background:var(--good-wash)} .to-pro h4{color:var(--good)}
.to-con{background:var(--bad-wash)} .to-con h4{color:var(--bad)}


/* ---------- figures ---------- */
.fig{margin:6px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px 6px}
.fig svg{width:100%;height:auto;display:block}
.fig-cap{font-size:12.5px;color:var(--ink-faint);text-align:center;padding:8px 10px 6px}
/* ---------- predict-before-reveal ---------- */
.reveal{background:var(--card);border:1.5px dashed var(--amber);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px}
.reveal-q{font-weight:600;margin-bottom:10px}
.reveal-q::before{content:"Predict first";display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.reveal-btn{background:var(--amber-wash);border:1px solid var(--amber);color:#8A5D06;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}
.reveal-a{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.reveal-a.show{display:block}
.reveal.revealed .reveal-btn{display:none}
.reveal-a ul{margin:0 0 0 20px}
/* ---------- classify exercise ---------- */
.cls{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 18px}
.cls-head{font-weight:600}
.cls-sub{font-size:12.5px;color:var(--ink-faint);margin:2px 0 12px}
.cls-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;padding:8px;border-radius:8px;background:var(--paper);margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;transition:border-color .1s}
.chip.sel{border-color:var(--amber);background:var(--amber-wash);font-weight:600}
.chip.right{border-color:var(--good);background:var(--good-wash)}
.chip.wrongc{border-color:var(--bad);background:var(--bad-wash)}
.cls-buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bucket{border:1.5px dashed var(--line);border-radius:10px;padding:10px;min-height:88px;cursor:pointer}
.bucket.target{border-color:var(--teal);background:var(--teal-wash)}
.bucket h5{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-dark);margin-bottom:8px;pointer-events:none}
.bucket .bchips{display:flex;flex-wrap:wrap;gap:6px}
.cls-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cls-result{font-size:13.5px;font-weight:600}
.cls-result.ok{color:var(--good)} .cls-result.no{color:var(--bad)}
/* ---------- simulations ---------- */
.sim{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 18px}
.sim-head{font-weight:600}
.sim-sub{font-size:12.5px;color:var(--ink-faint);margin:2px 0 4px}
.sim-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin:12px 0}
.sim-controls label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block}
.sim-controls output{float:right;font-family:var(--mono);font-size:12px;color:var(--teal-dark)}
input[type=range]{width:100%;accent-color:var(--teal);margin:2px 0 0}
.sim-out{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.stat{background:var(--paper);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--mono);font-weight:600;font-size:17px}
.stat .l{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.barrow{margin-top:10px;font-size:12px;color:var(--ink-soft)}
.barrow .bar{height:13px;border-radius:4px;background:var(--teal);margin:3px 0 8px;min-width:3px;transition:width .2s}
.barrow .bar.b2{background:var(--amber)}
.verdict{margin-top:10px;font-size:13.5px;background:var(--teal-wash);border-radius:8px;padding:9px 12px;color:var(--teal-dark)}
.verdict.melt{background:var(--bad-wash);color:var(--bad);font-weight:600}
.hist{display:flex;align-items:flex-end;gap:1px;height:64px;margin-top:12px}
.hist div{flex:1;background:var(--teal);border-radius:2px 2px 0 0;min-height:1px}
.chk{font-size:13px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.lp-ladder{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.lp-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card);cursor:pointer;transition:transform .08s,border-color .15s}
.lp-row:hover{transform:translateX(3px)}
.lp-num{font-family:var(--mono);font-weight:700;font-size:14px;width:26px;text-align:center;flex-shrink:0;color:var(--ink-faint)}
.lp-title{font-size:13.5px;color:var(--ink)}
.lp-row.lp-t0{border-left:4px solid #C7CCC6}
.lp-row.lp-t1{border-left:4px solid var(--teal)}
.lp-row.lp-t2{border-left:4px solid var(--amber)}
.lp-row.lp-t3{border-left:4px solid var(--bad)}
.lp-row.lp-active{border-color:var(--teal-dark);box-shadow:0 0 0 2px var(--teal-wash)}
.lp-row.lp-active .lp-num{color:var(--teal-dark)}
.dl-grid{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.dl-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card);cursor:pointer;border-left:4px solid var(--teal);transition:transform .08s,border-color .15s}
.dl-row:hover{transform:translateX(3px)}
.dl-num{font-family:var(--mono);font-weight:700;font-size:13px;width:24px;text-align:center;flex-shrink:0;color:var(--ink-faint)}
.dl-title{font-size:13.5px;color:var(--ink)}
.dl-row.dl-active{border-color:var(--teal-dark);box-shadow:0 0 0 2px var(--teal-wash)}
.dl-row.dl-active .dl-num{color:var(--teal-dark)}
@media (max-width:860px){.cls-buckets{grid-template-columns:1fr}.sim-controls{grid-template-columns:1fr}}

/* ---------- objectives & review ---------- */
.objectives{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin:0 0 22px}
.objectives h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--teal-dark);margin-bottom:6px}
.objectives ul{margin:0 0 0 18px}
.objectives li{font-size:14px;margin-bottom:4px}
.review-btn{display:block;width:calc(100% - 40px);margin:12px 20px 0;padding:9px 12px;font-size:13px;font-weight:600;color:var(--teal-dark);background:var(--teal-wash);border:1px solid var(--teal);border-radius:8px;text-align:center}
.review-btn:disabled{opacity:.55;border-color:var(--line);background:var(--paper);color:var(--ink-faint);cursor:default}
/* ---------- quiz ---------- */
.quiz{margin-top:44px;border-top:2px solid var(--line);padding-top:8px}
.quiz-head{font-family:var(--slab);font-weight:700;font-size:22px;margin:18px 0 4px}
.quiz-sub{font-size:13.5px;color:var(--ink-faint);margin-bottom:20px}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.q-text{font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:14.5px;color:var(--ink);transition:border-color .12s}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--good-wash);border-color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-wash);border-color:var(--bad)}
.explain{display:none;font-size:14px;background:var(--teal-wash);border-radius:8px;padding:10px 14px;margin-top:6px;color:var(--teal-dark)}
.explain.show{display:block}

/* ---------- footer nav ---------- */
.lesson-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:40px}
.btn{border:none;border-radius:8px;padding:11px 20px;font-size:14.5px;font-weight:600}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-dark)}
.btn:disabled{opacity:.45;cursor:default}
.done-flag{font-size:13px;font-weight:600;color:var(--good)}

/* ---------- mobile ---------- */
.topbar{display:none}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 24px rgba(0,0,0,.12)}
  .sidebar.open{transform:translateX(0)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(20,25,30,.35);z-index:30}
  .scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
  .topbar .menu{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--teal-dark)}
  .topbar .tb-title{font-family:var(--slab);font-weight:700;font-size:15px;color:var(--teal-dark)}
  .main{padding:24px 16px 80px}
  .lesson h2.title{font-size:26px}
  .tradeoff{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="topbar"><button class="menu" onclick="toggleNav()">☰ Lessons</button><span class="tb-title">Thinking in Systems</span></div>

<div class="app">
  <nav class="sidebar" id="sidebar">

      <p>Interactive course · Chapters 1–2 — from Donella H. Meadows’ primer</p>
    </div>

      <div class="progress-label"><span>Course progress</span><span id="progPct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>

    <div id="tree"></div>
  </nav>
  <main class="main"><article class="lesson" id="lesson"></article></main>
</div>
<script>
const COURSE=[
{title:"Module 1 \u00b7 The Basics",lessons:[

{id:"m1l1",title:"More Than the Sum of Its Parts",pages:"pp. 24\u201325",
obj:["Define a system in terms of its three required components","Distinguish a genuine system from a mere collection of parts"],
html:`
<p>A <span class="kw">system</span> is an interconnected set of elements, coherently organized so that it achieves something. Unpack that and you find three necessary ingredients: <span class="kw">elements</span>, <span class="kw">interconnections</span>, and a <span class="kw">function or purpose</span>. Your digestive system has elements (teeth, enzymes, stomach, intestines), interconnections (the physical flow of food plus chemical signals that regulate it), and a function (turning food into nutrients in the bloodstream while discarding waste). A football team qualifies too: players, coach, and ball, tied together by rules, strategy, and physics, aimed at winning, fun, or money.</p>

<h3>What isn't a system</h3>
<p>Sand scattered on a road by chance is just a conglomeration: add or remove sand and nothing meaningful changes. That's the test. Arbitrarily remove football players or pieces of your digestive tract and you quickly no longer have the same system. When a living creature dies it loses its "system-ness" \u2014 the interrelations stop functioning \u2014 even though its material carries on inside a larger food-web system. An apartment block of strangers isn't a social system yet; an old neighborhood where people know and help each other is.</p>

<p>The chapter offers a quick checklist: can you identify parts? Do the parts affect each other? Do they jointly produce an effect different from what each produces alone? And does that behavior persist across circumstances?</p>

<div class="note"><b>Key insight:</b> a system is more than the sum of its parts \u2014 it can behave adaptively, seek goals, repair itself, and even evolve, whether or not its parts are alive.</div>

<div data-classify="ex1"></div>
`,
quiz:[
{q:"Which three things must every system contain?",o:["Inputs, outputs, and feedback","Elements, interconnections, and a function or purpose","Matter, energy, and information","A boundary, a controller, and a goal"],a:1,e:"The definition on p. 24: an interconnected set of elements coherently organized to achieve something \u2014 elements, interconnections, and function/purpose."},
{q:"A crate holds every spare part needed to build a washing machine. Why is the crate not a system while the assembled machine is?",o:["The crate's parts are too small to matter","The parts in the crate have no interconnections and produce no joint effect","A system must contain living elements","The crate lacks a human operator"],a:1,e:"Like the sand on the road (p. 25), a conglomeration without interconnections or function is not a system \u2014 adding or removing pieces changes nothing essential."},
{q:"Per the chapter, why is a new apartment block full of strangers not (yet) a social system?",o:["It has too few elements","Its purpose hasn't been written down","No relationships \u2014 interconnections \u2014 have formed among the residents","Buildings can never be part of systems"],a:2,e:"P. 25: it becomes a social system only once relationships arise. Elements alone don't make a system; the interconnections do."}
]},

{id:"m1l2",title:"Players vs. the Rules of the Game",pages:"pp. 25\u201331",
obj:["Rank elements, interconnections, and purpose by how strongly changing each transforms a system","Deduce a system's purpose from its behavior rather than its stated goals","Explain how sub-purposes can conflict with a system's overall purpose"],
html:`
<p>Elements are the easiest part of a system to notice \u2014 many are visible, tangible things like a tree's roots and leaves or a university's buildings and professors. But elements can also be intangible: school pride and academic prowess are genuine elements of a university. Dissect elements forever and you lose the forest for the trees; the payoff comes from spotting the <span class="kw">interconnections</span> \u2014 many of which are flows of information feeding decision points, like a student picking courses based on grade gossip, or a consumer weighing income, prices, and savings before buying.</p>

<h3>Purpose is deduced from behavior</h3>
<p>Purposes are the hardest part to see, because they're rarely stated \u2014 they're revealed by what the system <em>does</em>. If a frog turns right, left, and backward, each time catching a fly, its purpose is catching flies, not turning. A government that proclaims environmental concern but allocates little money toward it does not have environmental protection as its purpose. Systems also nest: a university's purpose is passing on knowledge, while inside it a student may aim for grades, a professor for tenure, an administrator for a balanced budget \u2014 and any of those sub-purposes (cheating, ignoring students, firing professors) can undermine the whole. Keeping sub-purposes in harmony with the system purpose is essential to success.</p>

<div class="reveal"><div class="reveal-q">Replace all the players on a football team with new ones \u2014 or keep the players but swap the rulebook for basketball's. Which change still leaves you with a football team?</div>
<button class="reveal-btn" onclick="doReveal(this)">Reveal</button>
<div class="reveal-a"><p>The player swap. A team with all-new players is still recognizably a football team; change the rules and you've got a whole new ball game. Interconnections outrank elements.</p></div></div>

<h3>The importance ladder runs opposite to visibility</h3>
<p>Changing elements usually matters least \u2014 your body replaces most of its cells every few weeks yet stays your body. Changing interconnections can make a system unrecognizable, and changing purpose transforms it even if every element and interconnection stays put (imagine a team that plays to lose). A new leader \u2014 a Brezhnev to a Gorbachev, a Carter to a Reagan \u2014 may or may not redirect a nation: an element change matters when it changes the rules or the purpose, and slow-changing physical elements limit how fast any leader can turn the ship.</p>

<div class="fig"><svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans,system-ui,sans-serif">
<defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7A828C"/></marker></defs>
<rect x="150" y="20" width="400" height="52" rx="8" fill="#fff" stroke="#E4E7E2"/>
<text x="350" y="42" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="600">Elements</text>
<text x="350" y="60" text-anchor="middle" font-size="10.5" fill="#7A828C">players, cells, buildings \u2014 tangible, obvious</text>
<rect x="150" y="92" width="400" height="52" rx="8" fill="#E6F1EF" stroke="#116963"/>
<text x="350" y="114" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="600">Interconnections</text>
<text x="350" y="132" text-anchor="middle" font-size="10.5" fill="#7A828C">rules, signals, information flows \u2014 harder to see</text>
<rect x="150" y="164" width="400" height="52" rx="8" fill="#FBF3E1" stroke="#D9930D"/>
<text x="350" y="186" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="600">Function / purpose</text>
<text x="350" y="204" text-anchor="middle" font-size="10.5" fill="#7A828C">deduced only from behavior \u2014 least visible</text>
<line x1="90" y1="200" x2="90" y2="40" stroke="#7A828C" stroke-width="1.5" marker-end="url(#ah1)"/>
<text x="82" y="120" text-anchor="middle" font-size="10.5" fill="#7A828C" transform="rotate(-90 82 120)">easier to notice</text>
<line x1="614" y1="40" x2="614" y2="200" stroke="#7A828C" stroke-width="1.5" marker-end="url(#ah1)"/>
<text x="626" y="120" text-anchor="middle" font-size="10.5" fill="#7A828C" transform="rotate(90 626 120)">changing it transforms more</text>
</svg><div class="fig-cap">Visibility and leverage run in opposite directions: the least obvious layer, purpose, most strongly determines behavior.</div></div>

<div class="note"><b>Key insight:</b> the least obvious part of a system \u2014 its function or purpose \u2014 is often the most crucial determinant of its behavior; the most visible parts, the elements, usually matter least.</div>
`,
quiz:[
{q:"Which single change usually has the LEAST effect on a system's identity and behavior?",o:["Replacing its elements","Rewiring its interconnections","Changing its purpose","All three are equally disruptive"],a:0,e:"Pp. 29\u201331: swap every player, every cell, every student \u2014 the system goes on being itself as long as interconnections and purpose stay intact."},
{q:"A company's mission statement says 'customers first,' but budgets, promotions, and executive attention all flow to short-term stock price. Using the chapter's method, what is the company's purpose?",o:["Customers first \u2014 the stated mission defines purpose","Boosting the stock price \u2014 purpose is deduced from behavior","It has no purpose, since the two conflict","Whatever the CEO privately intends"],a:1,e:"Pp. 28: purposes are deduced from behavior, not from rhetoric or stated goals \u2014 exactly like the government that proclaims environmentalism but funds none."},
{q:"A professor ignores teaching to maximize publications and win tenure. In systems terms, this illustrates\u2026",o:["A missing element in the university","A sub-purpose conflicting with the system's overall purpose","Proof that the university has no real purpose","An interconnection failure between buildings"],a:1,e:"P. 29: purposes nest within purposes, and sub-purposes (grades, tenure, budgets) can come into conflict with the whole system's purpose."}
]},

{id:"m1l3",title:"Stocks, Flows, and the Bathtub",pages:"pp. 31\u201335",
obj:["Identify the stocks and flows in an everyday system","Predict whether a stock rises, falls, or holds steady from its inflows and outflows","Explain what dynamic equilibrium means"],
html:`
<p>A <span class="kw">stock</span> is the foundation of any system: a store or accumulation that has built up over time, something you can see, count, or measure at a given moment \u2014 water in a bathtub, a population, money in a bank, wood in a forest. Stocks don't have to be physical: your self-confidence and your reserve of goodwill toward others are stocks too. Stocks change through <span class="kw">flows</span>: filling and draining, births and deaths, deposits and withdrawals. A stock is the present memory of the history of changing flows within the system.</p>

<div class="fig"><svg viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans,system-ui,sans-serif">
<defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#116963"/></marker></defs>
<ellipse cx="70" cy="85" rx="42" ry="26" fill="#fff" stroke="#E4E7E2" stroke-dasharray="4 3"/>
<text x="70" y="89" text-anchor="middle" font-size="10.5" fill="#7A828C">source</text>
<line x1="112" y1="85" x2="270" y2="85" stroke="#116963" stroke-width="3" marker-end="url(#ah2)"/>
<line x1="185" y1="62" x2="185" y2="85" stroke="#116963" stroke-width="2.5"/><line x1="172" y1="62" x2="198" y2="62" stroke="#116963" stroke-width="2.5"/>
<text x="185" y="52" text-anchor="middle" font-size="10.5" fill="#7A828C">inflow faucet</text>
<rect x="274" y="52" width="152" height="66" rx="8" fill="#E6F1EF" stroke="#116963" stroke-width="1.5"/>
<text x="350" y="82" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="600">STOCK</text>
<text x="350" y="100" text-anchor="middle" font-size="10.5" fill="#7A828C">measurable now</text>
<line x1="430" y1="85" x2="588" y2="85" stroke="#116963" stroke-width="3" marker-end="url(#ah2)"/>
<line x1="505" y1="62" x2="505" y2="85" stroke="#116963" stroke-width="2.5"/><line x1="492" y1="62" x2="518" y2="62" stroke="#116963" stroke-width="2.5"/>
<text x="505" y="52" text-anchor="middle" font-size="10.5" fill="#7A828C">outflow faucet</text>
<ellipse cx="632" cy="85" rx="42" ry="26" fill="#fff" stroke="#E4E7E2" stroke-dasharray="4 3"/>
<text x="632" y="89" text-anchor="middle" font-size="10.5" fill="#7A828C">sink</text>
</svg><div class="fig-cap">The notation: stocks are boxes, flows are valve-controlled pipes, and dashed clouds mark the sources and sinks the model deliberately ignores.</div></div>

<h3>Reading behavior over time</h3>
<p>Systems thinkers read graphs of behavior over time rather than fixating on single events. What matters most is the <em>shape</em> of the line and where it bends \u2014 the exact numbers on the axes are often less important. Every diagram is a simplification: the mineral-deposit model omits the (eons-slow) inflow of new ore, and the bathtub model ignores evaporation. All models, mental or mathematical, simplify the real world.</p>

<h3>Dynamic equilibrium</h3>
<p>Pull the plug on a full tub and the level falls until it's empty. But refill it, open the drain, and \u2014 halfway down \u2014 open the faucet so inflow exactly matches outflow: the level freezes even though water is continuously streaming through. That state is <span class="kw">dynamic equilibrium</span>: an unchanging stock sustained by ongoing, matched flows.</p>

<div class="note"><b>Key insight:</b> if total inflow exceeds total outflow the stock rises; if outflow exceeds inflow it falls; if they're equal the stock holds \u2014 in dynamic equilibrium \u2014 at whatever level it happened to have when the flows matched.</div>

<div id="sim-tub"></div>
`,
quiz:[
{q:"In a reservoir system, which of these is the STOCK?",o:["The rain falling into it","The water stored behind the dam","The evaporation from its surface","The discharge through the dam"],a:1,e:"Pp. 32\u201333: the water in the reservoir is the accumulation you can measure at a moment; rain, evaporation, and discharge are the flows changing it."},
{q:"A forest gains 1,000 tons of wood a year through growth and loses 400 to natural death plus 800 to logging. What happens to the stock of wood?",o:["It rises, because growth is the biggest single flow","It falls, because total outflow (1,200) exceeds inflow (1,000)","It stays in dynamic equilibrium","Nothing can be concluded without knowing the forest's size"],a:1,e:"P. 36's principle: compare the SUM of inflows against the SUM of outflows \u2014 1,200 out vs. 1,000 in means the stock falls, regardless of any single flow."},
{q:"A lake's water level hasn't moved in months, yet rivers pour in and out constantly. The best description is\u2026",o:["The flows must have stopped","Measurement error \u2014 a stock with active flows must change","Dynamic equilibrium: inflow and outflow are equal, so the level holds","The lake has reached its maximum capacity"],a:2,e:"P. 35: in dynamic equilibrium the level doesn't change although water continuously flows through it."}
]},

{id:"m1l4",title:"Why Stocks Set the Pace",pages:"pp. 36\u201339",
obj:["Choose between raising inflow and cutting outflow as strategies for changing a stock","Explain why stocks act as delays, buffers, and sources of momentum","Describe how stocks decouple inflows from outflows"],
html:`
<p>Our minds fixate on stocks more easily than flows \u2014 and among flows, on inflows more than outflows. That blind spot hides half the levers.</p>

<div class="reveal"><div class="reveal-q">Everyone knows an oil-based economy can prolong its life by discovering new oil fields. What action involving no discovery at all has the identical effect on the stock of available oil?</div>
<button class="reveal-btn" onclick="doReveal(this)">Reveal</button>
<div class="reveal-a"><p>Burning less. A breakthrough in energy efficiency is equivalent, in its effect on the stock, to finding a new oil field \u2014 though different people profit from it.</p></div></div>

<p>There's more than one way to fill a bathtub: raise the inflow or cut the outflow. A company can grow its workforce by hiring more \u2014 or by reducing quitting and firing, often at very different cost. A nation can build wealth by investing in new factories, or often more cheaply by slowing the rate at which existing ones wear out.</p>

<h3>Stocks change slowly \u2014 and that's a feature</h3>
<p>You can slam a faucet open or shut, but the water level itself can only fill or drain gradually: flows take time to flow. So stocks act as <span class="kw">delays</span>, <span class="kw">buffers</span>, and sources of <span class="kw">momentum</span>. The stratospheric pollutants attacking the ozone layer took decades to accumulate and will take decades to clear; contaminated groundwater washes out only at the rate of turnover, possibly centuries. This lag causes problems but also grants stability: centuries-old soil rarely erodes all at once, and slow-draining stocks leave room to experiment and revise failing policies. Know your stocks' rates of change and you won't expect the impossible or give up too soon \u2014 you can steer with a system's momentum the way a judo expert uses an opponent's.</p>

<h3>Stocks decouple flows</h3>
<p>Because a stock sits between them, inflows and outflows can be independent and temporarily out of balance. Refineries needn't produce gasoline at exactly the rate cars burn it \u2014 storage tanks absorb the difference. Reservoirs buffer droughts and floods; banks let you earn and spend at different rates; inventories along supply chains smooth mismatched production and demand. In fact, most individual and institutional decisions exist to regulate stock levels: cutting prices when inventory piles up, shopping when the kitchen runs bare, adjusting herds and harvests as grain stocks shift.</p>

<div class="note"><b>Key insight:</b> a stock can be raised by cutting its outflow just as surely as by boosting its inflow \u2014 and because stocks change only at the pace of their flows, they set the tempo of the whole system.</div>
`,
quiz:[
{q:"A hospital must expand its nursing staff during a hiring freeze. Which stock-and-flow strategy remains available?",o:["None \u2014 without hiring, the staff stock can't grow","Cut the outflow: reduce resignations and dismissals through retention","Redefine nurses as a flow rather than a stock","Raise the inflow by reclassifying other staff"],a:1,e:"P. 37: a company can build a larger workforce by more hiring \u2014 or achieve the same thing by reducing the rates of quitting and firing."},
{q:"Why do stocks generally change slowly even when their flows change suddenly?",o:["Flows take time to flow, so a stock can only fill or drain gradually","Stocks are usually protected by regulations","Flows are always smaller than stocks","Because inflows and outflows always cancel out"],a:0,e:"P. 37: even with the drain fully open or the faucet on full blast, water can't leave or arrive instantly \u2014 which is why stocks act as delays, buffers, and shock absorbers."},
{q:"Gasoline storage tanks let refineries run steadily even as drivers' demand swings hour to hour. Which principle is at work?",o:["Dynamic equilibrium","Stocks allow inflows and outflows to be decoupled and temporarily out of balance","Purpose is deduced from behavior","Outflows always mirror inflows with a delay"],a:1,e:"P. 38: it would be hard to run an oil company if gasoline had to be produced at exactly the rate cars burn it \u2014 the stock between the two flows makes them independent."}
]},

{id:"m1l5",title:"Feedback: The System Steers Itself",pages:"pp. 39\u201345",
obj:["Detect the likely presence of a feedback loop from behavior that persists over time","Trace a balancing feedback loop from stock through discrepancy to corrective flow","Explain why a balancing loop may fail to reach its goal"],
html:`
<p>When a stock grows steadily, declines swiftly, or holds within a range no matter what happens around it, a control mechanism is probably at work. A consistent behavior pattern over a long period is the first hint of a <span class="kw">feedback loop</span>: a closed chain of causal connections from a stock, through decisions, rules, or physical laws that depend on the stock's level, and back through a flow to change that same stock. In a savings account, the balance (stock) determines the interest paid in (flow) \u2014 the stock drives its own inflow. Not every system has loops; some are open-ended chains whose stocks never influence their own flows.</p>

<h3>Balancing loops seek a goal</h3>
<p>A <span class="kw">balancing feedback loop</span> (marked <b>B</b> in diagrams) stabilizes a stock around a goal. When your checking balance runs low you work extra hours; when it swells you ease off. What drives the correction is the <span class="kw">discrepancy</span> \u2014 the gap between the actual and desired level. A coffee drinker tops up flagging energy with caffeine, and the same loop runs in reverse: too jittery, and you lay off the coffee. Loop labels are deliberately direction-free ("coffee intake," not "more coffee") because a balancing loop opposes <em>whatever</em> direction of change is imposed \u2014 push the stock up and it pulls back down; shove it down and it pushes back up.</p>

<div class="fig"><svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans,system-ui,sans-serif">
<defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#116963"/></marker>
<marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#D9930D"/></marker></defs>
<rect x="60" y="95" width="170" height="60" rx="8" fill="#E6F1EF" stroke="#116963" stroke-width="1.5"/>
<text x="145" y="121" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="600">Stock</text>
<text x="145" y="139" text-anchor="middle" font-size="10.5" fill="#7A828C">actual level</text>
<rect x="430" y="30" width="210" height="56" rx="8" fill="#FBF3E1" stroke="#D9930D" stroke-width="1.5"/>
<text x="535" y="53" text-anchor="middle" font-size="12" fill="#1C2128" font-weight="600">Discrepancy</text>
<text x="535" y="71" text-anchor="middle" font-size="10.5" fill="#7A828C">goal \u2212 actual level</text>
<rect x="430" y="164" width="210" height="56" rx="8" fill="#fff" stroke="#E4E7E2" stroke-width="1.5"/>
<text x="535" y="187" text-anchor="middle" font-size="12" fill="#1C2128" font-weight="600">Corrective action</text>
<text x="535" y="205" text-anchor="middle" font-size="10.5" fill="#7A828C">adjusts inflow or outflow</text>
<path d="M 230 105 C 310 70, 360 58, 424 58" fill="none" stroke="#D9930D" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah4)"/>
<text x="322" y="62" text-anchor="middle" font-size="10.5" fill="#7A828C">information about the stock</text>
<path d="M 535 86 L 535 158" fill="none" stroke="#D9930D" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah4)"/>
<path d="M 424 196 C 340 196, 250 180, 190 161" fill="none" stroke="#116963" stroke-width="3" marker-end="url(#ah3)"/>
<text x="315" y="228" text-anchor="middle" font-size="10.5" fill="#7A828C">flow changes the stock</text>
<circle cx="330" cy="128" r="17" fill="#fff" stroke="#116963" stroke-width="1.5"/>
<text x="330" y="133" text-anchor="middle" font-size="12.5" fill="#116963" font-weight="700">B</text>
</svg><div class="fig-cap">A balancing loop: the stock's level generates information, the gap against a goal triggers action, and action feeds back through a flow \u2014 always through a flow \u2014 to move the stock.</div></div>

<h3>Loops through physical law \u2014 and loops that fail</h3>
<p>Balancing loops need no human decider. A hot coffee cools at a rate proportional to the gap between its temperature and the room's; iced coffee warms by the same logic. Whatever the starting point, the stock "homes" toward the goal \u2014 changing fast at first, then slower as the discrepancy shrinks. The same gradual, goal-seeking approach shows up in radioactive decay, depreciating assets, and your body regulating blood sugar. But the presence of a feedback mechanism doesn't guarantee it works well: information can arrive too late, at the wrong place, or garbled, and the triggered action can be too weak, too delayed, or resource-starved \u2014 so the goal may never be reached.</p>

<div class="note"><b>Why this matters:</b> balancing loops make systems both stable and stubborn \u2014 the same machinery that holds a stock on target is a built-in source of resistance to change.</div>
`,
quiz:[
{q:"What is the FIRST hint that a feedback loop exists in a system?",o:["A written rule connecting two variables","A consistent behavior pattern persisting over a long period","A stock that never changes for any reason","The presence of a human decision-maker"],a:1,e:"P. 40: if you see behavior that persists over time, there is likely a mechanism creating it \u2014 that consistent pattern is the first clue of a feedback loop."},
{q:"In the coffee-drinker loop, what actually drives the decision to pour another cup?",o:["The absolute amount of caffeine consumed so far","The time elapsed since the last cup","The discrepancy between actual and desired energy levels","The price of coffee"],a:2,e:"P. 42: it is the gap between actual and desired energy for work that drives adjustments to caffeine intake \u2014 discrepancy, not absolute level, powers a balancing loop."},
{q:"A city sets a reservoir target level, but drought reports reach managers weeks late and release valves respond sluggishly. The reservoir chronically misses its target. The chapter's explanation:",o:["The loop must be reinforcing, not balancing","Feedback can fail when information arrives late and action is weak or delayed","Reservoirs cannot have feedback loops","The target level itself makes the loop impossible"],a:1,e:"P. 45: feedback mechanisms can fail \u2014 information too late or unclear, action too weak, delayed, or resource-constrained \u2014 so the goal may never be reached."},
{q:"You drop an ice-cold drink in a warm room and a scalding drink in the same room. What does the balancing loop do?",o:["Warms the cold one and cools the hot one, each toward room temperature","Only cools the hot one \u2014 loops work in one direction","Drives both to the same extreme they started from","Nothing, since no person is making decisions"],a:0,e:"Pp. 43\u201344: the loop drives the stock toward the goal from either direction \u2014 fast at first, slower as the discrepancy shrinks \u2014 and physical law needs no human decider."}
]},

{id:"m1l6",title:"Reinforcing Loops and Runaway Growth",pages:"pp. 45\u201350",
obj:["Classify a described loop as balancing or reinforcing","Compute doubling time from a growth rate using the rule of 70","Explain why exponential growth accelerates instead of climbing steadily"],
html:`
<p>The second kind of loop amplifies. A <span class="kw">reinforcing feedback loop</span> (marked <b>R</b>) is self-multiplying \u2014 a vicious or virtuous circle producing healthy growth or runaway destruction. It generates more input to a stock the more is already there, enhancing whatever direction of change is imposed on it. The chapter's examples: siblings shoving each other harder with each shove; wages and prices leapfrogging upward; more rabbits making more rabbit parents making more rabbits; eroding soil supporting fewer plants whose missing roots let more soil erode; piano practice making playing more enjoyable, prompting more practice.</p>

<h3>Exponential growth</h3>
<p>Reinforcing loops appear wherever a stock can reproduce itself or grow as a constant fraction of itself \u2014 populations, economies, interest-bearing accounts. Put $100 in the bank and the interest earned joins the balance, which then earns interest on itself. Over twelve years at rates from 2 to 10 percent, growth that looks almost linear at first goes faster and faster: the more is there, the more is added. That is <span class="kw">exponential growth</span> \u2014 good news or bad depending on what's growing, be it savings, an epidemic, crop pests, or an arms race. The same engine drives economies: more capital produces more output, which funds investment in yet more capital.</p>

<div class="reveal"><div class="reveal-q">You deposit $100 at 7% annual interest. Roughly how long until it becomes $200 \u2014 and what's the shortcut?</div>
<button class="reveal-btn" onclick="doReveal(this)">Reveal</button>
<div class="reveal-a"><p>About 10 years. <b>Doubling time \u2248 70 \u00f7 growth rate (%)</b>: 70 \u00f7 7 = 10. At 5% it would take 14 years.</p></div></div>

<h3>Once you see loops, you can't unsee them</h3>
<p>Meadows challenges students to name any human decision made with no regard to the level of the stock it affects \u2014 the usual candidates are falling in love and committing suicide, and she leaves it to you to judge whether even those qualify. The deeper shift: instead of only asking how A causes B, ask whether B also influences A. If the Federal Reserve acts on the economy, the economy has also acted on the Fed; if population growth causes poverty, ask how poverty may drive population growth. You stop hunting for someone to blame and start asking, "What's the system?" \u2014 because feedback means a system can cause its own behavior. And real systems rarely have one loop: many reinforcing and balancing loops of different strengths tug on the same stocks at once, which is why complex systems do far more than grow smoothly or settle neatly.</p>

<div class="note"><b>Key insight:</b> reinforcing loops are self-enhancing, producing exponential growth or runaway collapse \u2014 and they arise wherever a stock can reinforce or reproduce itself.</div>

<div data-classify="ex2"></div>
`,
quiz:[
{q:"\u201CThe more soil erodes, the fewer plants grow, so fewer roots hold the soil, so more soil erodes.\u201D This loop is\u2026",o:["Balancing \u2014 it seeks a bare-soil goal","Reinforcing \u2014 it amplifies the direction of change","An open chain with no feedback","Balancing, because erosion eventually stops"],a:1,e:"P. 46 lists this among reinforcing loops: each turn of the circle enhances the change, the signature of an R loop."},
{q:"A country's economy grows at 10% per year. Using the chapter's shortcut, roughly how long until it doubles?",o:["10 years","7 years","14 years","70 years"],a:1,e:"P. 49: doubling time \u2248 70 \u00f7 growth rate, so 70 \u00f7 10 = 7 years."},
{q:"Why does the bank balance in the chapter's example grow faster and faster rather than by a fixed amount each year?",o:["Banks raise interest rates over time","Interest joins the stock, so each year's interest is computed on a larger balance","Deposits were being added every year","It doesn't \u2014 compound interest is linear"],a:1,e:"P. 47: the more is there, the more is added \u2014 interest paid in becomes part of the stock that earns the next round of interest. That is exponential, not linear, growth."},
{q:"Your bank balance dips, so you pick up extra shifts until it recovers, then ease off. Balancing or reinforcing?",o:["Reinforcing \u2014 work generates money which generates more work","Balancing \u2014 action opposes the change and holds the stock near a desired range","Reinforcing \u2014 all money loops compound","Neither \u2014 human decisions aren't feedback"],a:1,e:"By the distinction on pp. 45\u201346, a reinforcing loop enhances change while this loop opposes it, restoring the stock to an acceptable range \u2014 the balancing pattern."}
]}

]},
{title:"Module 2 \u00b7 A Brief Visit to the Systems Zoo",lessons:[

{id:"m2l1",title:"The Thermostat: Two Competing Balancing Loops",pages:"pp. 51\u201358",
obj:["Explain why a stock controlled by competing balancing loops settles off-target","Diagnose control failures caused by ignoring ongoing draining or filling processes","Explain why feedback information can only affect future behavior"],
html:`
<p>Meadows opens her "zoo" of simple systems \u2014 grouped by family like monkeys and bears, single-stock animals here, two-stock animals there \u2014 admitting the collection is too neat: in the wild these animals interconnect. The first exhibit puts <em>two</em> balancing loops on one stock, each dragging it toward a different goal. A thermostat-furnace loop pulls room temperature up toward the setting; a heat-leak loop pulls it down toward the outdoor temperature, exactly like a cooling coffee cup.</p>

<div class="reveal"><div class="reveal-q">Thermostat set at 18\u00b0C, properly sized furnace, decent insulation. Where does the room temperature actually level off?</div>
<button class="reveal-btn" onclick="doReveal(this)">Reveal</button>
<div class="reveal-a"><p>Slightly <em>below</em> 18\u00b0C. Heat keeps leaking out even as the furnace responds, so the correcting loop is always chasing a draining stock. That's why people learn to set thermostats a bit above what they want.</p></div></div>

<h3>A bucket with a hole in it</h3>
<p>Worse, the leak is itself a feedback loop: the warmer the room, the bigger the inside\u2013outside gap and the faster heat escapes \u2014 like water pressure forcing more flow through a hole as the bucket fills. The general lesson: a stock-maintaining loop must set its goal high enough to <em>compensate for whatever draining or filling processes continue</em> while it acts. Order inventory without counting the goods that will sell before delivery arrives, and stock stays short; pay off a credit card without covering the interest accruing meanwhile, and the balance never dies; hire without covering those who quit during the hiring, and the workforce falls short. And every balancing loop has a <span class="kw">breakdown point</span>: on a bitter day, a leaky house loses heat faster than the furnace can replace it \u2014 dominance shifts to the cooling loop, and the room chills despite a working furnace. A well-insulated house beats a poorly insulated one with a big furnace.</p>

<div class="fig"><svg viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" font-family="Public Sans,system-ui,sans-serif">
<defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#116963"/></marker><marker id="ah6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#B3452E"/></marker></defs>
<rect x="265" y="85" width="170" height="60" rx="8" fill="#E6F1EF" stroke="#116963" stroke-width="1.5"/>
<text x="350" y="111" text-anchor="middle" font-size="12.5" fill="#1C2128" font-weight="600">Room temperature</text>
<text x="350" y="129" text-anchor="middle" font-size="10.5" fill="#7A828C">the contested stock</text>
<rect x="30" y="30" width="180" height="50" rx="8" fill="#fff" stroke="#116963" stroke-width="1.5"/>
<text x="120" y="51" text-anchor="middle" font-size="11.5" fill="#1C2128" font-weight="600">Furnace loop \u2014 B</text>
<text x="120" y="68" text-anchor="middle" font-size="10.5" fill="#7A828C">goal: thermostat setting</text>
<rect x="490" y="30" width="180" height="50" rx="8" fill="#fff" stroke="#B3452E" stroke-width="1.5"/>
<text x="580" y="51" text-anchor="middle" font-size="11.5" fill="#1C2128" font-weight="600">Leak loop \u2014 B</text>
<text x="580" y="68" text-anchor="middle" font-size="10.5" fill="#7A828C">goal: outside temperature</text>
<path d="M 150 80 C 190 110, 220 112, 259 113" fill="none" stroke="#116963" stroke-width="2.5" marker-end="url(#ah5)"/>
<text x="182" y="140" text-anchor="middle" font-size="10.5" fill="#116963">heat in \u2191</text>
<path d="M 550 80 C 510 110, 480 112, 441 113" fill="none" stroke="#B3452E" stroke-width="2.5" marker-end="url(#ah6)"/>
<text x="518" y="140" text-anchor="middle" font-size="10.5" fill="#B3452E">heat out \u2193</text>
<text x="350" y="190" text-anchor="middle" font-size="11" fill="#7A828C">Whichever loop is stronger at the moment dominates \u2014 and the stock settles between the two goals, closer to the winner's.</text>
</svg><div class="fig-cap">Two balancing loops tug one stock toward different goals; the room ends up near, but not at, the thermostat setting.</div></div>

<h3>Feedback arrives too late by definition</h3>
<p>Underneath lies a general principle: information delivered by a feedback loop \u2014 even nonphysical information \u2014 can only affect <em>future</em> behavior. A flow can't react instantly to a flow; it reacts to a change in a stock, after a delay to register the news. Economic models that assume production or consumption respond instantly to price get real economies wrong for exactly this reason.</p>

<div class="note"><b>Key insight:</b> a stock-maintaining balancing loop must set its goal to compensate for the draining or filling processes acting on the stock \u2014 otherwise it will chronically fall short of or overshoot its target.</div>
`,
quiz:[
{q:"With the thermostat at 18\u00b0C and everything working, why does the room level off slightly below 18\u00b0C?",o:["The thermostat's sensor is inaccurate","Heat leaks out even while the furnace responds, so the loop is compensating for a continuous drain","Furnaces cannot reach their own set point","Because 18\u00b0C is below the outside temperature"],a:1,e:"P. 54: the leak keeps draining heat even as the furnace gets the signal to replace it \u2014 the characteristic behavior of competing balancing loops."},
{q:"You repay a credit card with payments exactly equal to the current balance divided over 12 months, ignoring interest. Per the thermostat principle, what happens?",o:["The debt clears in 12 months as planned","The debt never quite clears \u2014 the goal failed to compensate for the ongoing inflow of interest charges","Interest is irrelevant to stock-and-flow analysis","The balance oscillates"],a:1,e:"Pp. 55\u201356: like ordering inventory without counting goods sold while you wait, a goal that ignores ongoing filling processes (interest accruing) leaves the loop chronically short of its target."},
{q:"Why can't any feedback loop correct the behavior that generated its current signal?",o:["Feedback signals travel at the speed of light, which is too slow","Information from feedback arrives only after the fact, so decisions based on it affect only future behavior","Feedback loops only work in physical, not informational, systems","Because stocks react instantly but flows do not"],a:1,e:"P. 55: feedback can't deliver a signal fast enough to correct the behavior that drove it \u2014 a flow reacts only to a change in a stock, after a delay. Hence delays in responding are unavoidable."},
{q:"On a brutally cold night, a leaky house's temperature falls even though the furnace runs at full blast. What happened, structurally?",o:["The furnace loop broke and stopped operating","The cooling loop grew stronger than the heating loop, so dominance shifted","The thermostat's goal changed on its own","The house stopped being a system"],a:1,e:"Pp. 57\u201358: every balancing loop has its breakdown point; when heat loss outpulls the furnace's capacity, the cooling loop dominates for a while."}
]},

{id:"m2l2",title:"Population and Economy: One Reinforcing, One Balancing",pages:"pp. 58\u201368",
obj:["Predict the three possible behaviors of a stock driven by one reinforcing and one balancing loop","Explain shifting dominance between feedback loops","Apply the three questions for testing what a model is worth","Compare population and capital systems as sharers of one feedback structure"],
html:`
<p>Put one reinforcing loop and one balancing loop on the same stock and you have one of the most common structures in the world: it describes every living population and every economy. A population grows through its birth loop (reinforcing) and drains through its death loop (balancing). With constant fertility and mortality the repertoire is small: the stock grows exponentially if the reinforcing loop is stronger, dies off if the balancing loop is stronger, and levels off in dynamic equilibrium if they match \u2014 or does these in sequence as their relative strengths change. In 2007 the world's 6.6 billion people had roughly 21 births and 9 deaths per 1,000 per year: the birth loop dominated, and at those rates a child born then would see the population more than double by age 60. Raise mortality to 30 per 1,000 (a terrible disease) and the death loop dominates instead.</p>

<div id="sim-pop"></div>

<h3>Shifting dominance</h3>
<p>The interesting behavior comes when the flows change over time. If fertility falls steadily until it equals mortality (the UN projects fertility approaching a replacement level of 1.85 children per woman as countries develop), growth bends into a plateau: first the reinforcing loop dominates, then neither does. This is <span class="kw">shifting dominance</span> \u2014 complex behaviors often arise exactly because the relative strengths of loops shift, handing control from one loop to another, as when the cold snap handed the leaky house to its cooling loop.</p>

<h3>Interrogating a model</h3>
<p>Meadows uses provocative population scenarios to teach three questions to ask of <em>any</em> scenario \u2014 forecast, budget, or stock tip: Are the driving factors likely to unfold this way? (Unanswerable in advance \u2014 the future is uncertain.) If they did, would the system really react this way? (A scientific question about the model's dynamics.) And what is driving the driving factors \u2014 are they truly independent, or fed back on by the system itself? Model utility hinges not on realistic driving scenarios but on responding with a <em>realistic pattern of behavior</em>. Dynamic models explore what <em>would</em> happen if \u2014 they don't predict what will.</p>

<h3>Same animal, different fur</h3>
<p>An economy's capital stock is the same zoo animal: output reinvested is the birth loop (the investment fraction plays the role of fertility), depreciation is the death loop (average capital lifetime plays longevity \u2014 in the book's example, with output at one-third of capital per year and 20 percent reinvested, a 15-year lifetime exactly keeps up with depreciation). Steel mills age and die just as people do. Systems with similar feedback structures produce similar dynamic behaviors, however dissimilar they look on the surface.</p>

<div class="note"><b>Key insight:</b> a stock with linked reinforcing and balancing loops can only grow, decline, level off, or do these in sequence \u2014 and which one you see depends on which loop currently dominates.</div>
`,
quiz:[
{q:"A stock is driven by one reinforcing and one balancing loop of constant strength. Which behavior is NOT in its repertoire?",o:["Exponential growth","Gradual die-off","Leveling off in dynamic equilibrium","Sustained oscillation around a fixed level"],a:3,e:"P. 62: with constant loop strengths the only possibilities are growth, decline, or leveling \u2014 sequences of these require the strengths to change. Oscillation needs delays (next lesson)."},
{q:"World fertility falls steadily until it exactly equals mortality in 2035, then both hold constant. The population\u2026",o:["Keeps growing exponentially from momentum forever","Immediately crashes","Levels off \u2014 dominance shifts from the birth loop to neither loop, giving dynamic equilibrium","Oscillates around its 2035 value"],a:2,e:"P. 61: births exactly balancing deaths puts the stock in dynamic equilibrium \u2014 the textbook example of shifting dominance ending in a plateau."},
{q:"A consultant's model predicts your industry's sales using an assumed 8% market growth. Per the chapter, which question about the model is genuinely scientific (testable)?",o:["Whether 8% growth will actually happen","Whether the system would really behave as modeled IF growth did run at 8%","Whether the consultant believes the scenario","None \u2014 models cannot be evaluated"],a:1,e:"Pp. 62\u201364: the first question is an unprovable guess about the future; the second \u2014 does the model capture the system's inherent dynamics \u2014 is the scientific one. Utility lies in realistic behavior patterns, not realistic scenarios."},
{q:"In the capital system, which pair correctly matches the population analogy?",o:["Investment fraction \u2194 fertility; capital lifetime \u2194 longevity","Investment fraction \u2194 mortality; depreciation \u2194 fertility","Output \u2194 death rate; depreciation \u2194 birth rate","Capital \u2194 births; output \u2194 deaths"],a:0,e:"Pp. 66\u201367: reinvested output is the birth loop with the investment fraction as fertility; depreciation is the death loop governed by average capital lifetime. Similar structures, similar behaviors (p. 68)."}
]},

{id:"m2l3",title:"Delays: Why the Car Dealer Oscillates",pages:"pp. 68\u201377",
obj:["Explain why a delay in a balancing feedback loop makes a system likely to oscillate","Predict the effect of shortening or lengthening a response delay on oscillation","Diagnose 'high leverage, wrong direction' interventions"],
html:`
<p>A car dealer keeps inventory at ten days' worth of sales \u2014 a buffer, because daily purchases are unpredictable and deliveries sometimes late. Structurally this is the thermostat again: one balancing loop drains inventory through sales, another restocks it through orders. Without delays, a 10 percent jump in demand produces an unsurprising, smooth adjustment. Then Meadows adds three real-world delays: a <span class="kw">perception delay</span> (she averages sales over five days to filter blips from trends), a <span class="kw">response delay</span> (she corrects only a third of any shortfall per order, spreading adjustment over three days), and a <span class="kw">delivery delay</span> (the factory takes five days to deliver).</p>

<p>Result: oscillations. The demand step drains inventory; by the time bigger orders are placed and arrive, inventory has fallen further, so she over-orders; the excess arrives, she cuts back too hard, under-orders, and the cycle repeats around the new target. Not because she's stupid \u2014 because she's operating without timely information, in a system whose physical delays prevent her actions from having immediate effect. The same structure gives you scalding-then-freezing showers when a long pipe separates the mixer from the showerhead.</p>

<div id="sim-inv"></div>

<h3>High leverage, wrong direction</h3>
<p>Determined to kill the oscillations, the dealer reacts <em>faster</em>. Shortening her perception delay from five days to two changes little (if anything it's slightly worse). Shortening her reaction time from three days to two makes things dramatically worse \u2014 she was overreacting, not underreacting. The fix that works is counterintuitive: <em>slowing down</em>, spreading corrections over six days, damps the oscillations and finds the new equilibrium efficiently. The delivery delay \u2014 the most important one \u2014 isn't under her control at all, yet she can still manage well around it. Meadows's phrase for the failed fix: <span class="kw">high leverage, wrong direction</span> \u2014 intuition correctly finds a powerful lever, then pushes it the wrong way.</p>

<p>Scale this up: all the unsold cars in America, with perception, production, delivery, and construction delays at every stage, plus reinforcing loops through jobs (production \u2192 jobs \u2192 car purchases \u2192 production) and speculation. Interlinked industries entraining each other's oscillations through their delays are the primary cause of business cycles \u2014 not presidents, though presidents can ease or intensify them. Economies are full of balancing loops with delays, and are inherently oscillatory.</p>

<div class="note"><b>Key insight:</b> a delay in a balancing feedback loop makes the system likely to oscillate \u2014 and changing the length of a delay can transform system behavior, which makes delays powerful (and dangerous) policy levers.</div>
`,
quiz:[
{q:"Why does the car dealer's inventory oscillate after a single permanent step in demand?",o:["Customer demand keeps fluctuating randomly","Delays mean her corrections are based on old information and act late, so she repeatedly over- and under-shoots","She miscalculates the ten-day coverage target","Oscillation is impossible with only balancing loops"],a:1,e:"Pp. 71\u201372: orders take time to arrive while inventory keeps falling, so she orders too much, then too little \u2014 information insufficiency plus physical delay, not stupidity."},
{q:"The dealer shortens her reaction time, correcting shortfalls in two days instead of three. Per the simulation, the oscillations\u2026",o:["Disappear immediately","Get very much worse \u2014 she was already overreacting","Are unchanged","Become slower but larger"],a:1,e:"Pp. 74\u201375: acting faster amplified the swings; the effective fix was lengthening the response delay to six days, which damped them."},
{q:"A city council, alarmed by housing-price swings, votes to make development approvals react to price changes twice as fast. The chapter's warning label for this move:",o:["Low leverage, right direction","High leverage, wrong direction","Shifting dominance","Dynamic equilibrium"],a:1,e:"P. 74: intuition finds a genuinely strong lever (a delay in a balancing loop) and pulls it the wrong way \u2014 faster response in a delayed loop typically worsens oscillation."},
{q:"According to the chapter, business cycles primarily come from\u2026",o:["Presidents and their policies","Interconnected industries responding to each other through delays, amplified by job and speculation loops","Consumer irrationality","Random external shocks only"],a:1,e:"Pp. 76\u201377: delays entrain oscillations across linked industries; presidents can ease or intensify the swings but don't cause them. Economies are inherently oscillatory."}
]},

{id:"m2l4",title:"Growth Meets a Nonrenewable Limit: the Oil Economy",pages:"pp. 77\u201385",
obj:["Explain why every physically growing system must eventually be constrained by a balancing loop","Predict how resource size and desired growth rate change the timing of peak extraction","Describe the trade-off between rapid extraction and the longevity of a resource-based economy"],
html:`
<p>The zoo animals so far were unconstrained \u2014 the modeled population needed no food, the furnace never ran out of oil. Real physical entities exchange materials with an environment, so any physically growing system eventually meets a constraint: a balancing loop that shifts dominance away from the growth loop, by strengthening the outflow or weakening the inflow. Systems thinkers call this the <span class="kw">limits-to-growth archetype</span>: wherever something grows \u2014 population, corporation, rumor, epidemic, product sales \u2014 look for the reinforcing loops driving it and the balancing loops that will eventually constrain it. They're there even before they dominate, because no physical system grows forever. (Pollution limits mirror resource limits: same dynamics, opposite flow direction \u2014 nonrenewable if the environment can't absorb the pollutant, renewable if it has finite absorption capacity.)</p>

<h3>The dynamics of depletion</h3>
<p>Take an oil company on a big new field: capital (20-year lifetime, so 5 percent depreciates yearly) grows through reinvested profits toward a 5 percent growth goal. But the resource stock has no inflow, and each barrel extracted makes the next one harder to get \u2014 deeper, more dilute, less pressurized. That declining yield per unit of capital is a new balancing loop: more capital \u2192 more extraction \u2192 less resource \u2192 lower yield \u2192 lower profit \u2192 lower investment \u2192 slower capital growth.</p>

<div class="reveal"><div class="reveal-q">The field holds a 200-year supply at the initial extraction rate, and the company grows its capital 5% per year. When does extraction peak?</div>
<button class="reveal-btn" onclick="doReveal(this)">Reveal</button>
<div class="reveal-a"><p>At about year 40. Exponential growth doubles extraction every 14 years, so the "200-year supply" is consumed shockingly early \u2014 and by year 50 maintenance costs overwhelm income and the operation shuts down, leaving the most expensive oil in the ground.</p></div></div>

<h3>Bigger fields buy less time than you'd think</h3>
<p>If geologists were wrong and the field is twice \u2014 or four times \u2014 as large, each doubling delays the extraction peak by only about 14 years, one doubling time. A quantity growing exponentially toward a limit reaches it in a surprisingly short time. Push the desired growth rate from 1 toward 7 percent and the peak arrives ever sooner \u2014 at 7 percent, within 40 years. Rising prices (or cost-cutting technology, as with taconite beneficiation and cyanide leaching in exhausted mines) don't rescue the system: they build the capital stock higher before the collapse and deplete the resource faster at the end. The higher and faster you grow, the farther and faster you fall. The real management choice for a nonrenewable resource: get rich very fast, or get less rich but stay that way longer.</p>

<div class="note"><b>Key insight:</b> nonrenewable resources are stock-limited \u2014 the whole stock is available at any extraction rate, but the faster you extract, the shorter the resource's lifetime; and against exponential growth, even quadrupling the resource buys only about two doubling times.</div>
`,

{q:"Why must every physically growing system eventually stop growing?",o:["Governments always regulate growth","Some balancing loop \u2014 a constraint \u2014 will eventually shift dominance away from the reinforcing loop, since nothing physical grows forever in a finite environment","Reinforcing loops wear out with age","Growth stops only if managers decide to stop it"],a:1,e:"Pp. 77\u201378: the constraining balancing loops are always present, even before they dominate \u2014 the limits-to-growth archetype."},
{q:"The oil field turns out to be four times as large as estimated. With growth continuing at 5% per year, peak extraction is delayed by roughly\u2026",o:["Four times as long \u2014 160 more years","About 28 years \u2014 two doubling times","About 100 years","Not at all"],a:1,e:"Pp. 81\u201382: each doubling of the resource shifts the peak by only ~14 years (one doubling time at 5% growth), so 4\u00d7 buys about 28 years."},
{q:"As the resource gets scarce, prices rise steeply, boosting profits and investment. The long-run effect, per the model:",o:["The system reaches sustainable equilibrium","Capital builds even higher before collapsing, and the resource is depleted faster at the end","Extraction continues at the initial rate forever","Depletion reverses"],a:1,e:"Pp. 83\u201385: higher prices (or lower operating costs from technology) mainly build the capital stock higher before it collapses \u2014 the higher you grow, the harder you fall."},
{q:"A mining CEO wants maximum extraction speed; a mining-town mayor wants the town to last. Which system quantity do they disagree about?",o:["The size of the resource \u2014 they read the geology differently","The desired growth rate of capital \u2014 the goal of the feedback loop","The depreciation rate of trucks","The price of the ore"],a:1,e:"P. 82: for the worker or community, the desired capital growth rate matters as much as resource size \u2014 the goal of a feedback loop is crucial to system behavior. The choice: rich fast, or less rich for longer."}
]},

{id:"m2l5",title:"Renewable Limits: the Fishing Economy",pages:"pp. 85\u201392",
obj:["Distinguish stock-limited (nonrenewable) from flow-limited (renewable) resources","Explain how the strength of a constraining balancing loop selects between equilibrium, oscillation, and collapse","Explain how harvesting technology can turn a renewable resource effectively nonrenewable"],
html:`
<p>Now give the resource stock an inflow. Fish, trees, and pasture regenerate themselves through a reinforcing loop; nonliving renewables like sunlight, wind, or river water refill through a steady input regardless of the stock's state. The same structure runs a cold-virus epidemic (recovered victims become susceptible again) and sales of any product people buy repeatedly \u2014 the stock of potential customers keeps regenerating.</p>

<h3>Three nonlinearities, three fates</h3>
<p>The fishery model keeps the oil economy's capital system (20-year capital lifetime, 5 percent growth if possible) but adds three nonlinear relationships: price (scarcer fish cost more), yield per unit of capital (technology), and crucially the <span class="kw">regeneration rate</span>, which depends on fish density. Crowded fish barely reproduce (food and habitat limit them); thin the population and regeneration speeds up; but deplete it too far and breeding slows again \u2014 mates can't find each other, or another species claims the niche. That hump-shaped curve creates a <span class="kw">critical threshold</span>.</p>

<p>The system has three characteristic outcomes. If the balancing feedback through falling profits reins in fleet growth quickly, harvest levels off \u2014 the fleet can't grow forever, but it can hold a high, steady harvest <em>forever</em>. Give the boats slightly better technology (sonar to find scarcer fish) and yield per boat holds up a little longer as fish decline: the balancing loop weakens, and the system overshoots and oscillates \u2014 another case of high leverage, wrong direction, where a productivity gain destabilizes the whole fishery. Make the technology better still, so boats stay profitable even at very low fish densities, and the result is overshoot and collapse: a near-wipeout of fish and industry alike, the marine equivalent of desertification. The fish have been turned, for practical purposes, into a nonrenewable resource.</p>

<div data-classify="ex3"></div>

<h3>Stock-limited vs. flow-limited</h3>
<p>Nonrenewable resources are <span class="kw">stock-limited</span>: the whole stock is available at once, extractable at any rate, but never renewed \u2014 so faster extraction means a shorter lifetime. Renewable resources are <span class="kw">flow-limited</span>: they can support harvest indefinitely, but only at a rate no faster than regeneration; harvest beyond that and they can be driven below the critical threshold. Which fate a real fishery meets depends on where that threshold sits and on how fast and effective the constraining balancing loop is. Some depleted resources rebuild once the harvesting capital is gone \u2014 New England logging is in its third cycle of growth, overcutting, collapse, and regeneration \u2014 but rising harvest efficiency increasingly drives resource populations to outright extinction. The trick with all complex systems: recognize which structures contain which latent behaviors, and arrange conditions to favor the beneficial ones.</p>

<div class="note"><b>Key insight:</b> whether a renewable-resource economy settles, oscillates, or collapses depends on the resource's critical regeneration threshold and on how quickly the balancing feedback slows capital growth as the resource depletes.</div>
`,
quiz:[
{q:"What is the defining difference between a renewable and a nonrenewable resource in this chapter?",o:["Renewables are living; nonrenewables are minerals","Renewables are flow-limited (harvest bounded by regeneration rate); nonrenewables are stock-limited (finite total, any extraction rate)","Renewables never run out under any harvesting regime","Nonrenewables regenerate, just slowly"],a:1,e:"Pp. 91\u201392: nonrenewables offer the whole stock at once but never refill; renewables can yield forever, but only at a flow no faster than regeneration."},
{q:"Sonar lets every boat keep catching efficiently as fish grow scarce. The model's outcome shifts from smooth equilibrium to\u2026",o:["Faster convergence to a higher equilibrium","Overshoot and oscillation \u2014 the weakened balancing loop reacts too late","Immediate collapse of the fleet","No change; technology is neutral"],a:1,e:"Pp. 89\u201390: maintaining yield as the resource declines weakens the constraining feedback \u2014 high leverage, wrong direction \u2014 and oscillations appear; even better technology brings collapse."},
{q:"Which condition produces overshoot and COLLAPSE rather than oscillation?",o:["A balancing loop so weak that capital keeps growing while the resource falls below its regeneration threshold","A balancing loop that stops capital growth before the threshold","Any use of fishing technology at all","High fish density at the start"],a:0,e:"P. 92: if feedback stops capital before the critical threshold, equilibrium; slower feedback, oscillation; feedback too weak to stop growth past the threshold, resource and industry both collapse."},
{q:"A software firm sells subscriptions people renew monthly. In zoo terms, its pool of potential customers is\u2026",o:["A nonrenewable, stock-limited resource","A renewable, flow-limited resource \u2014 the customer stock keeps regenerating","Not a resource at all","A reinforcing loop with no stock"],a:1,e:"P. 85: sales of a product people buy regularly is a renewable resource system \u2014 the stock of potential customers is ever regenerated, like the cold virus's supply of the susceptible."}
]}

]},
{title:"Module 3 \u00b7 Why Systems Work So Well",lessons:[

{id:"m3l1",title:"Resilience",pages:"pp. 94\u201398",
obj:["Explain how resilience arises from a rich structure of feedback loops","Distinguish resilience from static stability","Diagnose how optimizing for productivity or stability can erode resilience"],
html:`
<p>Chapter 2's simple systems create their own behavior and, within limits, recover their composure after being buffeted \u2014 a community mobilizing for a storm and then returning to normal. That recovering power is <span class="kw">resilience</span>: a system's ability to survive and persist in a variable environment, to bounce back into shape after being stretched. Its opposite is brittleness or rigidity.</p>

<p>Resilience arises from a rich structure of many feedback loops that restore a system through different mechanisms, at different time scales, with redundancy \u2014 one loop kicking in when another fails. A single balancing loop merely returns a stock to its state; resilience layers many. Loops that can restore <em>other</em> loops give meta-resilience; loops that can learn, design, and evolve new restorative structures give a higher level still \u2014 the self-organizing capacity of the next lesson. The human body is the exemplar: it repels countless invaders, tolerates wide swings in temperature and food, reallocates blood, repairs damage, and compensates for missing parts \u2014 though resilience is never infinite, since no body has yet kept itself from eventually dying. There are always limits to resilience.</p>

<h3>Resilience is not stability</h3>
<p>A resilient system can be highly dynamic \u2014 oscillations, periodic outbreaks, and long cycles of succession, climax, and collapse may be the very normalcy that resilience works to restore. Conversely, a system held rigidly constant may have no resilience at all. <span class="kw">Static stability</span> is visible: you measure it as week-to-week variation. Resilience is often invisible until you exceed its limits and the structure breaks. As C. S. Holling warned, forcing a system into a straitjacket of constancy can cause fragility to evolve.</p>

<div data-classify="ex4"></div>

<h3>The plateau</h3>
<p>Meadows pictures resilience as a plateau the system can play on safely, ringed by gentle elastic walls that bounce it back from dangerous edges. As resilience is lost, the plateau shrinks and the walls stiffen until the system balances on a knife-edge \u2014 and because it pays more attention to its play than to its playing space, the loss comes as a surprise: one day it does what it has done a hundred times before and crashes. Because resilience is hard to see, people trade it away for stability or productivity: bovine growth hormone lifts milk yield but leaves a less healthy, shorter-lived cow; just-in-time delivery cuts inventory cost but leaves production exposed to fuel, traffic, and labor glitches; single-species managed forests yield wood at a high rate but succumb to air pollution. Cancer and heart disease follow the breakdown of resilience mechanisms; large organizations lose resilience when feedback must crawl through too many layers of delay and distortion.</p>

<div class="note"><b>Key insight:</b> resilience comes from redundant, multi-scale feedback loops \u2014 not from holding a system constant \u2014 and because it is invisible until breached, it is routinely sacrificed for more measurable gains like productivity or stability.</div>
`,
quiz:[
