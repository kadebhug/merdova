          "@type": "Answer",
          "text": "A sprint starts at R45,000 for one workflow, fixed before we build. The free audit produces that quote. There is no hourly billing."

        }
      },
      {
        "@type": "Question",
        "name": "What happens to our data under POPIA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Your records stay in the systems you already control. We do not use your customer or staff data to train models. Who can access the data, how long we keep it, and what is handed over are written down before the build starts."
        }
      },
      {
        "@type": "Question",
        "name": "Which systems can you connect?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Xero, Sage, CRMs, ERPs, WhatsApp, email, and spreadsheets, plus anything that has an API or a reliable export. If a system can only give us a file, we start there."
        }
      },
      {
        "@type": "Question",
        "name": "Who owns the software when the sprint ends?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You do. Code, credentials, and documentation are handed to you. You are not locked into a Merdova subscription to keep the workflow running."
        }
      },
      {
        "@type": "Question",
        "name": "What support is included?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Thirty days of support is included after handover. A care retainer after that covers monitoring, small changes, and the next workflow, quoted once the first sprint is live."
        }
      },

        "@type": "Question",
        "name": "Do we have to replace our current software?",

  <!-- Start Single Page Apps for GitHub Pages -->
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back to the correct url and adds it to the browser's history
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
