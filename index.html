        "@type": "Question",
        "name": "How does the 2-Week Automation Sprint work, and what does it cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The sprint covers one workflow, delivered in 14 days. On the audit call you name the bottleneck. Within 48 hours you get a written scope, a fixed price in rand, and a list of what is out of scope. Most first sprints fall in the ranges on the audit form, from under R50,000 for a single integration to more when the workflow touches several systems. Work starts only after you approve that number."
        }
      },
      {
        "@type": "Question",
        "name": "Can you integrate with our accounting, ERP, or WhatsApp systems?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, when the system has an API or a supported export. We connect WhatsApp Business API, Xero, Sage, HubSpot, and custom databases. If you run Pastel or an older ERP, the audit is where we check a direct integration, a file import, or a small middleware service. We will say no if the system cannot be connected safely."
        }
      },
      {
        "@type": "Question",
        "name": "How do you handle POPIA, data security, and code ownership?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You keep the code and the IP. Staff see only the records their role needs. WhatsApp and CRM sync store a person's details only after consent is recorded. Message history sits in your systems, not in a shared inbox. Before we build the integration, we write down what data is stored, for how long, and how a deletion request is handled."
        }
      },
      {
        "@type": "Question",
        "name": "Can the mobile apps work offline on remote sites?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Field apps save the job on the device when there is no signal, then sync when the device is back online. Our engineering lead has shipped this pattern for workplace hazard logging on mining sites. The management dashboard updates from the synced records, not from a live connection the crew may not have."
        }
      },
      {
        "@type": "Question",
        "name": "What is included in your post-launch SLAs?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A written SLA names the response time, how incidents are handled after go-live, and what monitoring is included. The proposal states the hours and the channel. A retainer after handover is optional. You do not have to keep paying us to keep the system you already paid for."
        }
      }
    ]
  }

  <!-- Start Single Page Apps for GitHub Pages -->
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back to the correct url and adds it to the browser's history
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->
